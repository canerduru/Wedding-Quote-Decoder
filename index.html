      function normalizeMatchText(str) {
        return (str || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, ' ')
          .trim();
      }

      const MAX_FILE_BYTES = 14 * 1024 * 1024;

      function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const result = typeof reader.result === 'string' ? reader.result : '';
            const commaIdx = result.indexOf(',');
            if (commaIdx === -1) {
              reject(new Error('Invalid file encoding'));
              return;
            }
            resolve(result.slice(commaIdx + 1));
          };
          reader.onerror = () => reject(new Error('Failed to read file'));
          reader.readAsDataURL(file);
        });
      }

            handle.setPointerCapture(event.pointerId);
            this.drag = { id: venue.id, from, over: from, dx: 0, dy: 0 };

            const cardRects = () =>
              [...grid.querySelectorAll(':scope > article')].map((card, i) => {
                const r = card.getBoundingClientRect();
                const shift = i === from ? this.drag : { dx: 0, dy: 0 };
                return { left: r.left - shift.dx, right: r.right - shift.dx, top: r.top - shift.dy, bottom: r.bottom - shift.dy };
              });
            const onMove = (e) => {
              this.drag.dx = e.clientX - x0;
              this.drag.dy = e.clientY - y0;
              this.drag.over = window.__REORDER__.indexAtPoint(cardRects(), e.clientX, e.clientY, this.drag.over);
            };
            const stop = () => {
              handle.removeEventListener('pointermove', onMove);
              handle.removeEventListener('pointerup', onUp);
              handle.removeEventListener('pointercancel', onCancel);
            };
            const onUp = () => {
              stop();
              const { from: start, over } = this.drag;
              this.drag = null;
              this.reorderVenue(start, over);
            };
            const onCancel = () => {
              stop();
              this.drag = null;
            };
            handle.addEventListener('pointermove', onMove);
            handle.addEventListener('pointerup', onUp);
            handle.addEventListener('pointercancel', onCancel);
          },

          dragCardStyle(venue) {
            if (this.drag?.id !== venue.id) return {};
            return { transform: `translate(${this.drag.dx}px, ${this.drag.dy}px)`, zIndex: 30, transition: 'none' };
          },

          dragCardClass(venue, index) {
            if (!this.drag) return '';
            if (this.drag.id === venue.id) return 'relative shadow-2xl opacity-90 cursor-grabbing';
            return this.drag.over === index ? 'ring-2 ring-champagne ring-offset-2' : '';
          },

          openCard(venueId) {
            const venue = this.venues.find((v) => v.id === venueId);
            if (!venue) return;
            this.setViewMode('cards');
            this.openCards = { ...this.openCards, [venueId]: true };
            venue.editing = true;
            this.$nextTick(() => {
              document.getElementById(`venue-card-${venueId}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
          },

          get matrix() {
            const categories = this.getActiveComparisonCategories();
            const { columns } = window.__TABLE__.buildComparison({
              venues: this.venues,
              guestCount: this.guestCount,
              categories,
              categoryOf: (flag) => this.resolveFlagCategory(flag),
            });
            return window.__MATRIX__.buildMatrix({
              columns,
              categories,
              lang: this.lang,
              money: (eur) => this.formatCurrency(eur),
              t: (key) => this.t(key),
              categoryTitle: (cat) => this.getCategoryFullTitle(cat),
              validityText: (date) => this.validityText(date),
              venues: this.venues,
              guestCount: this.guestCount,
            });
          },

          matrixStyle() {
            return { tableLayout: 'fixed', width: '100%', minWidth: `calc(var(--mx-first) + ${Math.max(1, this.venues.length)} * var(--mx-col))` };
          },

          toggleGroup(key) {
            this.collapsedGroups = { ...this.collapsedGroups, [key]: !this.collapsedGroups[key] };
          },

          isExpanded(rowKey, colId) {
            return Boolean(this.expandedCells[`${rowKey}|${colId}`]);
          },

          toggleExpand(rowKey, colId) {
            const key = `${rowKey}|${colId}`;
            this.expandedCells = { ...this.expandedCells, [key]: !this.expandedCells[key] };
          },

          sectionOpen(venue, key) {
            return this.openSections[`${venue.id}:${key}`] ?? key !== 'extras';
          },

          toggleSection(venue, key) {
            this.openSections = { ...this.openSections, [`${venue.id}:${key}`]: !this.sectionOpen(venue, key) };
          },

          extrasSummary(venue) {
            const flags = venue.flags || [];
            const included = flags.filter((f) => f.type === 'safe').length;
            const gaps = window.__COMPLETE__.completeness(venue).needsPriceCount;
            const parts = [`${flags.length} ${this.t('extrasSummaryItems')}`];
            if (included) parts.push(`${included} ${this.t('extrasSummaryIncluded')}`);
            if (gaps) parts.push(`${gaps} ${this.t('noPriceShort')}`);
            return parts.join(' · ');
          },

          showTable() {
            return this.venues.length >= 2 && this.viewMode === 'table';
          },

          comparison() {
            return window.__TABLE__.buildComparison({
              venues: this.venues,
              guestCount: this.guestCount,
              categories: this.getActiveComparisonCategories(),
              categoryOf: (flag) => this.resolveFlagCategory(flag),
            });
          },

          setGuests(event) {
            const value = window.__GUESTS__.clampGuests(event.target.value);
            if (value === null) {
              event.target.value = this.guestCount;
              return;
            }
            this.guestCount = value;
            event.target.value = value;
          },

          fxRates() {
            return { ...window.__RATES__.DEFAULT_RATES, TRY: this.exchangeRate };
          },

          rateSourceText() {
            const R = window.__RATES__.DEFAULT_RATES;
            if (this.exchangeRate !== R.TRY) return this.t('rateSourceEdited');
            const date = new Date(`${R.date}T00:00:00`).toLocaleDateString(this.lang === 'tr' ? 'tr-TR' : 'en-GB', {
              day: 'numeric',
              month: 'short',
              year: 'numeric',
            });
            return `${this.t('rateSourceDefault')} · ${date}`;
          },

          setTryRate(event) {
            const value = Number(String(event.target.value).replace(',', '.'));
            if (!Number.isFinite(value) || value <= 0) {
              event.target.value = this.exchangeRate;
              this.showToast(this.t('toastRateInvalid'));
              return;
            }
            const old = this.exchangeRate;
            this.venues.forEach((v) => window.__RATES__.rescaleSource(v, 'TRY', old, value));
            this.pendingVendorAddons.forEach((a) => window.__RATES__.rescaleSource(a, 'TRY', old, value));
            this.exchangeRate = value;
          },

          needKey() {
            return !this.geminiKey;
          },

          maskedKey() {
            const k = this.geminiKey;
            return k.length > 8 ? `${k.slice(0, 4)}…${k.slice(-4)}` : '••••';
          },

          saveKey() {
            const key = window.__APIKEY__.normalizeKey(this.keyDraft);
            if (!window.__APIKEY__.isValidKeyFormat(key)) {
              this.showToast(this.t('toastKeyFormat'));
              return;
            }
            this.geminiKey = key;
            this.keyDraft = '';
            this.editingKey = false;
            try {
              localStorage.setItem('wqd:gemini-key', key);
            } catch {
              // keep the key in memory for this session only
            }
            this.showToast(this.t('toastKeySaved'));
          },

          clearKey() {
            this.geminiKey = '';
            this.editingKey = false;
            try {
              localStorage.removeItem('wqd:gemini-key');
            } catch {
              // ignore
            }
            this.showToast(this.t('toastKeyRemoved'));
          },

          exportBackup() {
            const json = window.__PERSIST__.serializeState(this);
            const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = `wedding-quotes-${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
          },

          async importBackup(event) {
            const file = event.target?.files?.[0];
            event.target.value = '';
            if (!file) return;
            const restored = window.__PERSIST__.parseState(await file.text());
            if (!restored) {
              this.showToast(this.t('toastImportFailed'));
              return;
            }
            Object.assign(this, restored);
            document.documentElement.lang = this.lang;
            document.title = this.t('pageTitle');
            this.refreshIcons();
            this.showToast(this.t('toastImported'));
          },

          async checkShareLink() {
            const hash = window.location.hash;
            if (!/^#?s=/.test(hash)) return;
            history.replaceState(null, '', window.location.pathname + window.location.search);
            const json = await window.__SHARE__.decodeShare(hash);
            const restored = json && window.__PERSIST__.parseState(json);
            if (!restored || restored.venues.length === 0) {
              this.showToast(this.t('toastShareInvalid'));
              return;
            }
            this.pendingShare = restored;
          },

          acceptShare() {
            Object.assign(this, this.pendingShare);
            this.pendingShare = null;
            document.documentElement.lang = this.lang;
            document.title = this.t('pageTitle');
            this.refreshIcons();
            this.showToast(this.t('toastShareImported'));
          },

          dismissShare() {
            this.pendingShare = null;
          },

          async shareLink() {
            if (this.venues.length === 0) return;
            const payload = await window.__SHARE__.encodeShare(window.__PERSIST__.serializeState(this));
            const url = window.__SHARE__.buildShareUrl(window.location.origin + window.location.pathname, payload);
            try {
              await navigator.clipboard.writeText(url);
            } catch {
              window.prompt(this.t('shareCopyPrompt'), url);
              return;
            }
            this.showToast(this.t(url.length > window.__SHARE__.SHARE_WARN_LENGTH ? 'toastLinkCopiedLong' : 'toastLinkCopied'));
          },

          t(key) {
            return I18N[this.lang][key] || key;
          },

          setLang(newLang) {
            if (this.lang === newLang) return;
            this.lang = newLang;
            document.documentElement.lang = newLang;
            document.title = this.t('pageTitle');
            this.showToast(this.t('toastLangSwitched'));
          },

          refreshIcons() {
            this.$nextTick(() => {
              if (window.lucide) window.lucide.createIcons();
            });
          },

          showToast(msg) {
            this.toastMessage = msg;
            this.toastVisible = true;
            setTimeout(() => {
              this.toastVisible = false;
            }, 4000);
          },

          getSliderProgressStyle() {
            const pct = window.__GUESTS__.sliderPercent(this.guestCount);
            return `background: linear-gradient(to right, #C8A97E 0%, #C8A97E ${pct}%, #EFE6E0 ${pct}%, #EFE6E0 100%)`;
          },

          resolveCoverKey(regionObj, typeObj, nameStr, fallbackIndex = 0) {
            const combined = `${regionObj?.tr || ''} ${regionObj?.en || ''} ${typeObj?.tr || ''} ${typeObj?.en || ''} ${nameStr || ''}`.toLowerCase();
            if (/saray|palace|boğaz|bosphorus|istanbul|çırağan|ciragan|hotel|otel|yalı|waterfront/.test(combined)) {
              return 'bosphorusPalace';
            }
            if (/como|lake|göl|villa|bodrum|riviera|capri|amalfi|sea|deniz|beach/.test(combined)) {
              return 'lakeVilla';
            }
            if (/toskana|tuscany|estate|malikane|bağ|vineyard|kır|stone|taş|countryside|alaçatı|url|olive/.test(combined)) {
              return 'tuscanEstate';
            }
            if (/sera|glass|atelier|bahçe|garden|modern|loft|conservatory|botanik/.test(combined)) {
              return 'modernAtelier';
            }
            const keys = ['lakeVilla', 'bosphorusPalace', 'tuscanEstate', 'modernAtelier'];
            return keys[fallbackIndex % keys.length];
          },

          getAvailableCoverModes(venue) {
            const modes = [];
            if (venue.realPhotoUrl && !venue.realPhotoError) modes.push('real');
            if (venue.uploadedPreviewUrl) modes.push('quote');
            modes.push('mood');
            return modes;
          },

          getActiveCoverKind(venue) {
            const hasReal = Boolean(venue.realPhotoUrl && !venue.realPhotoError);
            const hasQuote = Boolean(venue.uploadedPreviewUrl);
            if (venue.coverMode === 'real' && hasReal) return 'real';
            if (venue.coverMode === 'quote' && hasQuote) return 'quote';
            if (venue.coverMode === 'mood') return 'mood';
            if (hasReal) return 'real';
            if (hasQuote) return 'quote';
            return 'mood';
          },

          getVenueCoverUrl(venue) {
            const kind = this.getActiveCoverKind(venue);
            if (kind === 'real' && venue.realPhotoUrl) {
              return venue.realPhotoUrl;
            }
            if (kind === 'quote' && venue.uploadedPreviewUrl) {
              return venue.uploadedPreviewUrl;
            }
            const covers = window.__VENUE_COVERS__ || {};
            if (venue.coverKey && covers[venue.coverKey]) {
              return covers[venue.coverKey];
            }
            const key = this.resolveCoverKey(venue.region, venue.venueType, venue.name);
            return covers[key] || covers.lakeVilla || '';
          },

          handleCoverImgError(venue) {
            const kind = this.getActiveCoverKind(venue);
            if (kind === 'real') {
              venue.realPhotoError = true;
              venue.coverMode = 'auto';
              return;
            }
            if (kind === 'quote') {
              venue.uploadedPreviewUrl = '';
              venue.coverMode = 'mood';
              return;
            }
            venue.coverError = true;
          },

          cycleCoverMode(venue) {
            const modes = this.getAvailableCoverModes(venue);
            if (modes.length <= 1) return;
            const current = this.getActiveCoverKind(venue);
            const idx = modes.indexOf(current);
            const nextMode = modes[(idx + 1) % modes.length];
            venue.coverMode = nextMode;
            venue.coverError = false;
          },

          getNextCoverToggleLabel(venue) {
            const modes = this.getAvailableCoverModes(venue);
            if (modes.length <= 1) return '';
            const current = this.getActiveCoverKind(venue);
            const idx = modes.indexOf(current);
            const nextMode = modes[(idx + 1) % modes.length];
            if (nextMode === 'real') return this.t('viewRealPhoto');
            if (nextMode === 'quote') return this.t('viewQuoteShot');
            return this.t('viewMoodCover');
          },

          async fetchVenuePhoto(venueId, force = false) {
            const venue = this.venues.find((v) => v.id === venueId);
            if (!venue) return;
            const name = (venue.name || '').trim();
            if (name.length < 2) return;

            const rawRegion = (venue.region?.[this.lang] || venue.region?.en || venue.region?.tr || '').trim();
            const region = /belirtilmedi|unspecified|şehir|city|manuel|manual/i.test(rawRegion) ? '' : rawRegion;
            const queryKey = `${name.toLowerCase()}::${region.toLowerCase()}`;

            if (!force && venue.photoQueryKey === queryKey && (venue.photoStatus === 'searching' || venue.photoStatus === 'found')) {
              return;
            }

            venue.photoQueryKey = queryKey;
            venue.photoStatus = 'searching';
            venue.realPhotoError = false;

            try {
              const data = await window.__PHOTO__.findVenuePhoto({ name, region });

              const currentVenue = this.venues.find((v) => v.id === venueId);
              if (!currentVenue || currentVenue.photoQueryKey !== queryKey) return;

              if (data.found) {
                currentVenue.realPhotoUrl = data.imageUrl;
                currentVenue.realPhotoSourceUrl = data.sourceUrl || '';
                currentVenue.realPhotoSourceLabel = data.sourceLabel || '';
                currentVenue.realPhotoError = false;
                currentVenue.photoStatus = 'found';
                currentVenue.coverMode = 'auto';
                currentVenue.coverError = false;
              } else {
                currentVenue.realPhotoUrl = '';
                currentVenue.realPhotoSourceUrl = '';
                currentVenue.realPhotoSourceLabel = '';
                currentVenue.photoStatus = 'not_found';
              }
            } catch {
              const currentVenue = this.venues.find((v) => v.id === venueId);
              if (currentVenue && currentVenue.photoQueryKey === queryKey) {
                currentVenue.photoStatus = 'not_found';
              }
            } finally {
              this.refreshIcons();
            }
          },

          onVenueNameCommitted(venue) {
            if (!venue) return;
            const trimmed = (venue.name || '').trim();
            if (trimmed.length > 0) {
              venue.nameUnknown = false;
              if (trimmed.length >= 2) {
                this.fetchVenuePhoto(venue.id, false);
              }
            }
          },

          getCategoryBadge(category) {
            const meta = VENDOR_CATEGORY_META[category] || VENDOR_CATEGORY_META.other;
            return meta.badge[this.lang];
          },

          getFlagMicroPill(flag) {
            if (flag.vendorCategory) {
              return this.getCategoryBadge(flag.vendorCategory);
            }
            if (flag.calcType === 'vat_pct') {
              return VENDOR_CATEGORY_META.tax.badge[this.lang];
            }
            return '';
          },

          getCategoryFullTitle(category) {
            const meta = VENDOR_CATEGORY_META[category] || VENDOR_CATEGORY_META.other;
            return meta.fullTitle[this.lang];
          },

          displayVenueName(venue) {
            const trimmed = (venue.name || '').trim();
            return trimmed.length > 0 ? trimmed : this.t('unnamedVenueFallback');
          },

          formatCurrency(eurAmount) {
            return window.__SUMMARY__.formatMoney(eurAmount, this.currency, this.exchangeRate, this.lang);
          },

          getFlagAmountEur(venue, flag) {
            return window.__CALC__.getFlagAmountEur(venue, flag, this.guestCount);
          },

          calculateBreakdown(venue) {
            return window.__CALC__.calculateBreakdown(venue, this.guestCount);
          },

          getBudgetDistribution(venue) {
            const b = this.calculateBreakdown(venue);
            const total = b.turnkeyTotalEur;
            if (!total || total <= 0) {
              return { basePct: 0, fbPct: 0, extrasPct: 0 };
            }
            const baseFee = Math.max(0, Number(venue.baseFeeEur) || 0);
            const fb = Math.max(0, b.fbSubtotalEur);
            const extras = Math.max(0, b.hiddenExtrasTotalEur);
            const basePct = (baseFee / total) * 100;
            const fbPct = (fb / total) * 100;
            const extrasPct = Math.max(0, 100 - basePct - fbPct);
            return {
              basePct: Math.round(basePct * 10) / 10,
              fbPct: Math.round(fbPct * 10) / 10,
              extrasPct: Math.round(extrasPct * 10) / 10,
              baseShare: Math.round(basePct),
              fbShare: Math.round(fbPct),
              extrasShare: Math.round(extrasPct),
            };
          },

          standings() {
            return window.__LOWEST__.lowestStanding(this.venues, this.guestCount);
          },

          standingOf(venue) {
            return this.standings().find((s) => s.id === venue.id) || { total: 0, complete: false, best: false, deltaEur: 0 };
          },

          getDeltaFromLowest(venue) {
            return this.standingOf(venue).deltaEur;
          },

          isBestValue(venue) {
            return this.standingOf(venue).best;
          },

          isEstimate(venue) {
            const s = this.standingOf(venue);
            return s.total > 0 && !s.complete;
          },

          lowestUnknownCount() {
            const priced = this.standings().filter((s) => s.total > 0);
            if (priced.length < 2 || priced.some((s) => s.best)) return 0;
            return priced.filter((s) => !s.complete).length;
          },

          resolveFlagCategory(flag) {
            if (!flag) return 'other';
            if (flag.category && CANONICAL_CATEGORY_ORDER.includes(flag.category)) {
              return flag.category;
            }
            if (flag.vendorCategory && CANONICAL_CATEGORY_ORDER.includes(flag.vendorCategory)) {
              return flag.vendorCategory;
            }
            if (flag.calcType === 'vat_pct') {
              return 'tax';
            }
            const text = `${flag.label?.tr || ''} ${flag.label?.en || ''} ${flag.detail?.tr || ''} ${flag.detail?.en || ''}`.toLowerCase();
            const searchOrder = ['tax', 'catering', 'music', 'floral', 'boat', 'photo'];
            for (const cat of searchOrder) {
              const meta = VENDOR_CATEGORY_META[cat];
              if (meta && meta.keywords.some((kw) => text.includes(kw))) {
                return cat;
              }
            }
            return 'other';
          },

          getActiveComparisonCategories() {
            const present = new Set();
            this.venues.forEach((v) => {
              (v.flags || []).forEach((f) => {
                present.add(this.resolveFlagCategory(f));
              });
            });
            return CANONICAL_CATEGORY_ORDER.filter((cat) => present.has(cat));
          },

          missingCategories(venue) {
            return this.getActiveComparisonCategories().filter((cat) => this.getVenueFlagsByCategory(venue, cat).length === 0);
          },

          getVenueFlagsByCategory(venue, category) {
            return (venue.flags || []).filter((f) => this.resolveFlagCategory(f) === category);
          },

          openAddFlagForCategory(venueId, category) {
            const venue = this.venues.find((v) => v.id === venueId);
            if (!venue) return;
            venue.newFlag = {
              label: '',
              calcType: category === 'tax' ? 'vat_pct' : 'fixed',
              amount: '',
              category: CANONICAL_CATEGORY_ORDER.includes(category) ? category : '',
            };
            venue.showAddFlag = true;
          },

          toggleFlag(venueId, flagId) {
            const venue = this.venues.find((v) => v.id === venueId);
            if (!venue) return;
            const flag = venue.flags.find((f) => f.id === flagId);
            if (!flag || flag.type !== 'risk') return;
            flag.active = !flag.active;
            if (flag.active && flag.replacedBy) {
              flag.replacedBy = '';
            }
          },

          removeFlag(venueId, flagId) {
            const venue = this.venues.find((v) => v.id === venueId);
            if (!venue) return;
            venue.flags = venue.flags.filter((f) => f.id !== flagId);
          },

          addCustomFlag(venueId) {
            const venue = this.venues.find((v) => v.id === venueId);
            if (!venue) return;
            const labelText = (venue.newFlag.label || '').trim();
            const amt = Number(venue.newFlag.amount);
            if (!labelText || !Number.isFinite(amt) || amt < 0) return;

            const calcType = venue.newFlag.calcType || 'fixed';
            const chosenCategory = venue.newFlag.category;
            const resolvedCategory =
              chosenCategory && CANONICAL_CATEGORY_ORDER.includes(chosenCategory)
                ? chosenCategory
                : this.resolveFlagCategory({
                    label: { tr: labelText, en: labelText },
                    detail: { tr: '', en: '' },
                    calcType,
                  });

            const suffix =
              calcType === 'vat_pct' || calcType === 'service_pct'
                ? `(+%${amt})`
                : calcType === 'per_guest'
                  ? `(+€${amt} / ${this.lang === 'tr' ? 'kişi' : 'guest'})`
                  : `(+€${amt.toLocaleString('tr-TR')})`;

            venue.flags.push({
              id: 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
              category: resolvedCategory,
              type: 'risk',
              label: {
                tr: `${labelText} ${suffix}`,
                en: `${labelText} ${suffix}`,
              },
              detail: {
                tr: 'Kullanıcı tarafından eklenen özel maliyet kalemi.',
                en: 'Custom cost item added by user.',
              },
              calcType,
              amount: amt,
              active: true,
            });

            venue.newFlag = { label: '', calcType: 'fixed', amount: '', category: '' };
            venue.showAddFlag = false;
            this.refreshIcons();
          },

          showUndo(text, action) {
            clearTimeout(this.undoTimer);
            this.undoBar = { visible: true, text, action };
            this.undoTimer = setTimeout(() => {
              this.undoBar = { visible: false, text: '', action: null };
            }, 8000);
          },

          undoLast() {
            const action = this.undoBar.action;
            clearTimeout(this.undoTimer);
            this.undoBar = { visible: false, text: '', action: null };
            if (!action) return;
            action();
            this.refreshIcons();
            this.showToast(this.t('toastRestored'));
          },

          removeVenue(venueId) {
            const removed = window.__UNDO__.removeWithUndo(this.venues, venueId);
            if (!removed) return;
            this.venues = removed.list;
            this.showUndo(this.t('undoVenueRemoved'), () => {
              this.venues = window.__UNDO__.restoreRemoved(this.venues, removed.undo);
            });
            this.refreshIcons();
          },

          venueName(venueId) {
            const venue = this.venues.find((v) => v.id === venueId);
            return venue ? this.displayVenueName(venue) : '';
          },

          similarQuestion(doc) {
            const mine = doc.venue.name;
            const other = this.venueName(doc.candidateId);
            return this.lang === 'tr'
              ? `“${mine}” belgesi “${other}” ile aynı mekan mı?`
              : `Is the “${mine}” document the same venue as “${other}”?`;
          },

          recordConflicts(venue, conflicts) {
            if (!conflicts.length) return;
            const known = (venue.mergeConflicts || []).filter((c) => !conflicts.some((n) => n.key === c.key));
            venue.mergeConflicts = [...known, ...conflicts];
          },

          conflictLabelKey(key) {
            return {
              baseFeeEur: 'baseFeeLabel',
              fbPerPersonEur: 'fbPerPersonLabel',
              minimumSpendEur: 'termsMinSpend',
              statedTotalEur: 'termsStatedTotal',
              depositNote: 'termsDeposit',
              cancellationNote: 'termsCancel',
              durationNote: 'termsDuration',
              datesNote: 'termsDates',
              guestsNote: 'termsGuests',
              validUntil: 'termsValid',
            }[key] || key;
          },

          conflictValue(conflict, which) {
            const value = conflict[which];
            if (conflict.kind === 'money') return this.formatCurrency(value);
            if (conflict.kind === 'date') return this.validityText(value) || value;
            return value?.[this.lang] || value?.tr || value?.en || '';
          },

          resolveMergeConflict(venueId, key, choice) {
            const venue = this.venues.find((v) => v.id === venueId);
            const conflict = venue?.mergeConflicts?.find((c) => c.key === key);
            if (!conflict) return;
            window.__MERGE__.resolveConflict(venue, conflict, choice);
            venue.mergeConflicts = venue.mergeConflicts.filter((c) => c.key !== key);
          },

          cyclePreview(venue) {
            if (!venue.extraPreviews?.length) return;
            venue.extraPreviews.push(venue.uploadedPreviewUrl);
            venue.uploadedPreviewUrl = venue.extraPreviews.shift();
            venue.coverMode = 'quote';
          },

          finishMerge(target, conflicts) {
            this.recordConflicts(target, conflicts);
            if (!target.realPhotoUrl && (target.name || '').trim().length >= 2) this.fetchVenuePhoto(target.id, false);
            this.refreshIcons();
          },

          confirmPendingVenue(pendingId, targetId) {
            const doc = this.pendingVenueDocs.find((d) => d.id === pendingId);
            if (!doc) return;
            const target = this.venues.find((v) => v.id === targetId);
            if (!target) {
              this.keepPendingSeparate(pendingId);
              return;
            }
            this.finishMerge(target, window.__MERGE__.mergeVenue(target, doc.venue));
            this.pendingVenueDocs = this.pendingVenueDocs.filter((d) => d.id !== pendingId);
            this.showToast(`${this.t('toastMergedInto')} ${this.displayVenueName(target)}`);
          },

          keepPendingSeparate(pendingId) {
            const doc = this.pendingVenueDocs.find((d) => d.id === pendingId);
            if (!doc) return;
            this.venues.push(doc.venue);
            if (!doc.venue.nameUnknown && (doc.venue.name || '').trim().length >= 2) this.fetchVenuePhoto(doc.venue.id, false);
            this.pendingVenueDocs = this.pendingVenueDocs.filter((d) => d.id !== pendingId);
            this.refreshIcons();
          },

          dismissPendingVenue(pendingId) {
            this.pendingVenueDocs = this.pendingVenueDocs.filter((d) => d.id !== pendingId);
          },

          mergeVenueInto(sourceId, targetId) {
            if (!targetId || sourceId === targetId) return;
            const source = this.venues.find((v) => v.id === sourceId);
            const target = this.venues.find((v) => v.id === targetId);
            if (!source || !target) return;

            const conflicts = window.__MERGE__.mergeVenue(target, source);
            target.editing = true;
            this.venues = this.venues.filter((v) => v.id !== sourceId);
            this.finishMerge(target, conflicts);
            this.showToast(conflicts.length ? `${conflicts.length} ${this.t('toastMergeConflicts')}` : this.t('toastMerged'));
          },

          addBlankManualVenue() {

            const keys = ['lakeVilla', 'bosphorusPalace', 'tuscanEstate', 'modernAtelier'];
            this.venues.push({

              realPhotoSourceUrl: '',
              realPhotoSourceLabel: '',
              realPhotoError: false,

              region: { tr: 'Şehir / Bölge', en: 'City / Region' },
              venueType: { tr: 'Manuel Kart', en: 'Manual Card' },

          resetDashboard() {
            const previous = { venues: this.venues, pendingVendorAddons: this.pendingVendorAddons, pendingVenueDocs: this.pendingVenueDocs };
            this.venues = [];
            this.pendingVendorAddons = [];
            this.pendingVenueDocs = [];
            this.batchQueue = [];
            this.failedQueue = [];
            this.refreshIcons();
            this.showUndo(this.t('undoAllCleared'), () => {
              this.venues = previous.venues;
              this.pendingVendorAddons = previous.pendingVendorAddons;
              this.pendingVenueDocs = previous.pendingVenueDocs;
            });
          },

          buildVendorAddonObject(v, fileName) {
            const category = VENDOR_CATEGORY_META[v.vendorCategory] ? v.vendorCategory : 'other';
            const vendorName = (v.name || '').trim();
            const rawFlags = Array.isArray(v.flags) ? v.flags : [];

            const isPctItem = (f) => f.calcType === 'vat_pct' || f.calcType === 'service_pct';
            const serviceItems = rawFlags.filter((f) => f.type === 'risk' && !isPctItem(f));
            if (serviceItems.length === 0 && ((Number(v.baseFeeEur) || 0) > 0 || (Number(v.fbPerPersonEur) || 0) > 0)) {
              if ((Number(v.baseFeeEur) || 0) > 0) {
                serviceItems.push({
                  type: 'risk',
                  calcType: 'fixed',
                  amount: Number(v.baseFeeEur),
                  sourceCurrency: v.sourceCurrency,
                  active: true,
                  label: {
                    tr: vendorName || VENDOR_CATEGORY_META[category].fullTitle.tr,
                    en: vendorName || VENDOR_CATEGORY_META[category].fullTitle.en,
                  },
                  detail: v.originalCurrencyNote || { tr: 'Sabit hizmet paketi', en: 'Fixed service package' },
                });
              }
              if ((Number(v.fbPerPersonEur) || 0) > 0) {
                serviceItems.push({
                  type: 'risk',
                  calcType: 'per_guest',
                  amount: Number(v.fbPerPersonEur),
                  sourceCurrency: v.sourceCurrency,
                  active: true,
                  label: {
                    tr: `${vendorName || VENDOR_CATEGORY_META[category].fullTitle.tr} (Kişi Başı)`,
                    en: `${vendorName || VENDOR_CATEGORY_META[category].fullTitle.en} (Per Guest)`,
                  },
                  detail: v.originalCurrencyNote || { tr: 'Kişi başı hizmet bedeli', en: 'Per-guest service rate' },
                });
              }
            }

            let vendorTaxBaseFixed = 0;
            let vendorTaxBasePerGuest = 0;
            serviceItems.forEach((item) => {
              if (item.calcType === 'per_guest') {
                vendorTaxBasePerGuest += Number(item.amount) || 0;
              } else {
                vendorTaxBaseFixed += Number(item.amount) || 0;
              }
            });

            if (vendorTaxBaseFixed === 0 && vendorTaxBasePerGuest === 0) {
              vendorTaxBaseFixed = Number(v.baseFeeEur) || 0;
              vendorTaxBasePerGuest = Number(v.fbPerPersonEur) || 0;
            }

            const vatItems = rawFlags
              .filter((f) => f.type === 'risk' && isPctItem(f))
              .map((f) => ({
                ...f,
                calcType: 'vendor_vat_pct',
                vendorBaseEur: vendorTaxBaseFixed,
                vendorPerGuestEur: vendorTaxBasePerGuest,
              }));

            const safeItems = rawFlags.filter((f) => f.type === 'safe');
            const infoItems = rawFlags.filter((f) => f.type === 'info');
            const itemizedFlags = [...serviceItems, ...vatItems, ...safeItems, ...infoItems];

            return {
              id: 'addon-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
              vendorCategory: category,
              vendorName,
              targetVenueHint: (v.targetVenueHint || '').trim(),
              fileName,
              region: v.region || { tr: 'Dış Hizmet', en: 'External Vendor' },
              venueType: v.venueType || VENDOR_CATEGORY_META[category].fullTitle,
              originalCurrencyNote: v.originalCurrencyNote || { tr: '', en: '' },
              baseFeeEur: vendorTaxBaseFixed,
              fbPerPersonEur: vendorTaxBasePerGuest,
              rawFlags,
              itemizedFlags,
              flags: itemizedFlags,
              sourceCurrency: v.sourceCurrency || '',
            };
          },

          estimateAddonTotalEur(addon) {
            let total = 0;
            addon.itemizedFlags.forEach((f) => {
              if (f.type === 'risk' && f.active) {
                if (f.calcType === 'fixed') total += Number(f.amount) || 0;
                else if (f.calcType === 'per_guest') total += (Number(f.amount) || 0) * this.guestCount;
                else if (f.calcType === 'vendor_vat_pct') {
                  const base = (Number(f.vendorBaseEur) || 0) + (Number(f.vendorPerGuestEur) || 0) * this.guestCount;
                  total += (base * (Number(f.amount) || 0)) / 100;
                }
              }
            });
            return total;
          },

          findMatchedVenueId(targetVenueHint) {
            const hint = normalizeMatchText(targetVenueHint);
            if (!hint || hint.length < 3) return null;
            const matches = this.venues.filter((v) => {
              const vName = normalizeMatchText(v.name);
              return vName.length >= 3 && (vName.includes(hint) || hint.includes(vName));
            });
            return matches.length === 1 ? matches[0].id : null;
          },

          venueIncludesCategory(venue, vendorCategory) {
            const meta = VENDOR_CATEGORY_META[vendorCategory];
            if (!meta || meta.keywords.length === 0) return false;
            return venue.flags.some((flag) => {
              if (flag.type !== 'safe') return false;
              const text = `${flag.label?.tr || ''} ${flag.label?.en || ''} ${flag.detail?.tr || ''} ${flag.detail?.en || ''}`.toLowerCase();
              return meta.keywords.some((kw) => text.includes(kw));
            });
          },

          attachVendorToVenue(addon, venueId) {
            const venue = this.venues.find((v) => v.id === venueId);
            if (!venue) return;

            const meta = VENDOR_CATEGORY_META[addon.vendorCategory] || VENDOR_CATEGORY_META.other;
            const sourceTag = addon.vendorName ? `${addon.vendorName} (${addon.fileName})` : addon.fileName;

            if (meta.keywords.length > 0) {
              venue.flags.forEach((existingFlag) => {
                if (existingFlag.type === 'risk' && existingFlag.active && !existingFlag.vendorCategory) {
                  const text = `${existingFlag.label?.tr || ''} ${existingFlag.label?.en || ''} ${existingFlag.detail?.tr || ''} ${existingFlag.detail?.en || ''}`.toLowerCase();
                  if (meta.keywords.some((kw) => text.includes(kw))) {
                    existingFlag.active = false;
                    existingFlag.replacedBy = sourceTag;
                  }
                }
              });
            }

            const stamp = Date.now() + '-' + Math.random().toString(36).slice(2, 5);
            addon.itemizedFlags.forEach((f, idx) => {
              venue.flags.push({
                id: `${venue.id}-v-${stamp}-${idx}`,
                type: f.type === 'safe' || f.type === 'info' ? f.type : 'risk',
                vendorCategory: addon.vendorCategory,
                vendorSourceFile: addon.fileName,
                vendorName: addon.vendorName,
                label: f.label || { tr: meta.fullTitle.tr, en: meta.fullTitle.en },
                detail: f.detail || { tr: '', en: '' },
                calcType: f.calcType || 'fixed',
                amount: Number(f.amount) || 0,
                vendorBaseEur: Number(f.vendorBaseEur) || 0,
                vendorPerGuestEur: Number(f.vendorPerGuestEur) || 0,
                sourceCurrency: f.sourceCurrency,
                active: f.type === 'safe' || f.type === 'info' ? false : Boolean(f.active),
              });
            });

            this.refreshIcons();
          },

          assignPendingToSingle(pendingId, venueId) {
            const addon = this.pendingVendorAddons.find((p) => p.id === pendingId);
            if (!addon) return;
            this.attachVendorToVenue(addon, venueId);
            this.pendingVendorAddons = this.pendingVendorAddons.filter((p) => p.id !== pendingId);
            this.showToast(this.t('toastVendorAssigned'));
          },

          assignPendingToMissing(pendingId) {
            const addon = this.pendingVendorAddons.find((p) => p.id === pendingId);
            if (!addon || this.venues.length === 0) return;
            const targets = this.venues.filter((v) => !this.venueIncludesCategory(v, addon.vendorCategory));
            if (targets.length === 0) {
              this.showToast(this.t('toastVendorMissingNoMatch'));
              return;
            }
            targets.forEach((v) => this.attachVendorToVenue(addon, v.id));
            this.pendingVendorAddons = this.pendingVendorAddons.filter((p) => p.id !== pendingId);
            this.showToast(`${this.getCategoryBadge(addon.vendorCategory)} — ${targets.length} ${this.t('toastVendorAssignedCount')}`);
          },

          assignPendingToAll(pendingId) {
            const addon = this.pendingVendorAddons.find((p) => p.id === pendingId);
            if (!addon || this.venues.length === 0) return;
            this.venues.forEach((v) => this.attachVendorToVenue(addon, v.id));
            this.pendingVendorAddons = this.pendingVendorAddons.filter((p) => p.id !== pendingId);
            this.showToast(`${this.getCategoryBadge(addon.vendorCategory)} — ${this.venues.length} ${this.t('toastVendorAssignedCount')}`);
          },

          convertPendingToStandalone(pendingId) {
            const addon = this.pendingVendorAddons.find((p) => p.id === pendingId);
            if (!addon) return;
            const uid = 'standalone-' + Date.now();
            const isUnknown = !addon.vendorName;
            this.venues.push({
              id: uid,
              name: addon.vendorName || '',
              nameUnknown: isUnknown,
              editing: false,
              showAddFlag: false,
              showUploadedPreview: false,
              uploadedPreviewUrl: '',
              realPhotoUrl: '',
              realPhotoSourceUrl: '',
              realPhotoSourceLabel: '',
              realPhotoError: false,
              photoStatus: 'idle',
              photoQueryKey: '',
              coverMode: 'auto',
              coverKey: 'modernAtelier',
              coverError: false,
              newFlag: { label: '', calcType: 'fixed', amount: '', category: '' },
              region: addon.region,
              venueType: addon.venueType,
              capacityLabel: { tr: 'Bağımsız Hizmet', en: 'Standalone Service' },
              sourceLabel: {
                tr: `Dosya: ${addon.fileName}${addon.sourceCurrency ? ' · ' + addon.sourceCurrency : ''}`,
                en: `File: ${addon.fileName}${addon.sourceCurrency ? ' · ' + addon.sourceCurrency : ''}`,
              },
              sourceCurrency: addon.sourceCurrency || '',
              ...window.__TERMS__.emptyTerms(),
              baseFeeEur: addon.baseFeeEur,
              fbPerPersonEur: addon.fbPerPersonEur,
              flags: addon.rawFlags
                .filter((f) => f.calcType === 'vat_pct' || f.calcType === 'service_pct' || f.type === 'safe' || f.type === 'info')
                .map((f, idx) => ({
                  id: `${uid}-f-${idx}`,
                  category: CANONICAL_CATEGORY_ORDER.includes(f.category) ? f.category : undefined,
                  type: f.type === 'safe' || f.type === 'info' ? f.type : 'risk',
                  label: f.label,
                  detail: f.detail,
                  calcType: f.calcType,
                  amount: Number(f.amount) || 0,
                  sourceCurrency: f.sourceCurrency,
                  active: Boolean(f.active),
                })),
            });
            this.pendingVendorAddons = this.pendingVendorAddons.filter((p) => p.id !== pendingId);
            if (!isUnknown && addon.vendorName) {
              this.fetchVenuePhoto(uid, false);
            }
            this.refreshIcons();
            this.showToast(this.t('toastVendorStandalone'));
          },

          dismissPendingVendor(pendingId) {
            this.pendingVendorAddons = this.pendingVendorAddons.filter((p) => p.id !== pendingId);
          },

          submitPastedText() {
            const check = window.__PASTED__.validatePastedText(this.pastedText);
            if (!check.ok) {
              this.showToast(this.t({ empty: 'toastTextEmpty', short: 'toastTextShort', long: 'toastTextLong' }[check.error]));
              return;
            }
            if (this.isScanning || this.cardScanningId) {
              this.showToast(this.t('toastBusy'));
              return;
            }
            if (this.needKey()) {
              this.editingKey = true;
              this.showToast(this.t('toastKeyNeeded'));
              this.$nextTick(() => document.getElementById('api-key-box')?.scrollIntoView({ behavior: 'smooth', block: 'center' }));
              return;
            }
            this.textCounter += 1;
            const doc = window.__PASTED__.makeTextDocument({
              text: check.text,
              nameHint: this.pastedName,
              name: `${this.t('pastedTextName')} ${this.textCounter}`,
            });
            this.textPanelOpen = false;
            this.pastedText = '';
            this.pastedName = '';
            this.processUploadedFiles([doc], null);
          },

          handlePaste(event) {
            if (window.__PASTE__.isEditableTarget(event.target)) return;
            const files = window.__PASTE__.extractPasteFiles(event.clipboardData);
            if (files.length === 0) return;
            event.preventDefault();
            this.processUploadedFiles(files, null);
          },

          handleDrop(event) {
            this.isDragging = false;
            const files = Array.from(event.dataTransfer?.files || []);
            if (files.length > 0) {
              this.processUploadedFiles(files, null);
            }
          },

          handleFileInput(event) {
            const files = Array.from(event.target?.files || []);
            if (files.length > 0) {
              this.processUploadedFiles(files, null);
              event.target.value = '';
            }
          },

          handleCardDrop(event, venueId) {
            const files = Array.from(event.dataTransfer?.files || []);
            if (files.length > 0) {
              this.processUploadedFiles(files, venueId);
            }
          },

          handleCardFileInput(event, venueId) {
            const files = Array.from(event.target?.files || []);
            if (files.length > 0) {
              this.processUploadedFiles(files, venueId);
              event.target.value = '';
            }
          },

          async processUploadedFiles(files, targetVenueId = null) {
            if (this.isScanning || this.cardScanningId) return;
            if (this.needKey()) {
              this.editingKey = true;
              this.showToast(this.t('toastKeyNeeded'));
              this.$nextTick(() => document.getElementById('api-key-box')?.scrollIntoView({ behavior: 'smooth', block: 'center' }));
              return;
            }

            if (targetVenueId) {
              this.cardScanningId = targetVenueId;
            } else {
              this.isScanning = true;
              this.batchQueue = files.map((file) => ({
                name: file.name,
                status: 'pending',
                error: '',
              }));
            }

            let venueAddedCount = 0;
            let vendorAutoAttachedCount = 0;
            let vendorQueuedCount = 0;
            let venueQueuedCount = 0;
            let hasError = false;
            let lastAutoAttachMsg = '';
            let currencyWarned = false;

            for (let i = 0; i < files.length; i++) {
              const file = files[i];
              if (!targetVenueId && this.batchQueue[i]) {
                this.batchQueue[i].status = 'scanning';
              }

              try {
                if (file.size > MAX_FILE_BYTES) {
                  throw new Error(this.lang === 'tr' ? 'Dosya 14 MB sınırını aşıyor.' : 'File exceeds the 14 MB limit.');
                }

                const isText = file.isText === true;
                const base64Data = isText ? '' : await readFileAsBase64(file);
                const mimeType = isText ? 'text/plain' : file.type || (file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/png');
                const isImageFile = !isText && mimeType.startsWith('image/');
                const uploadedPreviewUrl = isImageFile ? `data:${mimeType};base64,${base64Data}` : '';

                let payload;
                try {
                  payload = await window.__DECODE__.decodeQuote({
                    apiKey: this.geminiKey,
                    fileName: file.name,
                    mimeType,
                    base64Data,
                    text: isText ? file.text : undefined,
                    nameHint: isText ? file.nameHint : undefined,
                  });
                } catch (decodeErr) {
                  if (decodeErr.code === 'API_KEY_INVALID') this.editingKey = true;
                  throw decodeErr;
                }

                const v = window.__RATES__.convertDecoded(payload.venue, this.fxRates());
                if (v.currencyUnknown) currencyWarned = true;

                if (targetVenueId) {
                  const addon = this.buildVendorAddonObject(v, file.name);
                  this.attachVendorToVenue(addon, targetVenueId);
                  vendorAutoAttachedCount += 1;
                } else if (v.docCategory === 'vendor_addon') {
                  const addon = this.buildVendorAddonObject(v, file.name);
                  const matchedId = this.findMatchedVenueId(addon.targetVenueHint);

                  if (matchedId) {
                    const matchedVenue = this.venues.find((x) => x.id === matchedId);
                    this.attachVendorToVenue(addon, matchedId);
                    vendorAutoAttachedCount += 1;
                    lastAutoAttachMsg = `${this.getCategoryBadge(addon.vendorCategory)} ${this.t('toastVendorAutoMatched')} ${this.displayVenueName(matchedVenue)}`;
                  } else {
                    this.pendingVendorAddons.push(addon);
                    vendorQueuedCount += 1;
                  }
                } else {
                  const uid = 'uploaded-' + Date.now() + '-' + i;
                  const parsedName = (v.name || '').trim();
                  const isUnknown = v.nameFound === false || parsedName.length === 0;
                  const regionObj = v.region || { tr: 'Belirtilmedi', en: 'Unspecified' };
                  const typeObj = v.venueType || { tr: 'Yüklenen Teklif', en: 'Uploaded Quote' };

                  const normalizedVenue = {
                    id: uid,
                    name: isUnknown ? '' : parsedName,
                    nameUnknown: isUnknown,
                    editing: false,
                    showAddFlag: false,
                    showUploadedPreview: false,
                    uploadedPreviewUrl,
                    realPhotoUrl: '',
                    realPhotoSourceUrl: '',
                    realPhotoSourceLabel: '',
                    realPhotoError: false,
                    photoStatus: 'idle',
                    photoQueryKey: '',
                    coverMode: 'auto',
                    coverKey: this.resolveCoverKey(regionObj, typeObj, parsedName, this.venues.length + i),
                    coverError: false,
                    newFlag: { label: '', calcType: 'fixed', amount: '', category: '' },
                    region: regionObj,
                    venueType: typeObj,
                    capacityLabel: v.capacityLabel || { tr: 'Kapasite Belirtilmedi', en: 'Capacity Unspecified' },
                    sourceLabel: {
                      tr: `Dosya: ${file.name}${v.sourceCurrency ? ' · ' + v.sourceCurrency : ''}`,
                      en: `File: ${file.name}${v.sourceCurrency ? ' · ' + v.sourceCurrency : ''}`,
                    },
                    sourceCurrency: v.sourceCurrency,
                    ...window.__TERMS__.termsFromDecoded(v),
                    baseFeeEur: Number(v.baseFeeEur) || 0,
                    fbPerPersonEur: Number(v.fbPerPersonEur) || 0,
                    flags: Array.isArray(v.flags)
                      ? v.flags.map((f, fIdx) => ({
                          id: `${uid}-flag-${fIdx}`,
                          category: CANONICAL_CATEGORY_ORDER.includes(f.category) ? f.category : undefined,
                          type: f.type === 'safe' || f.type === 'info' ? f.type : 'risk',
                          label: f.label || { tr: 'Ek Kalem', en: 'Additional Item' },
                          detail: f.detail || { tr: '', en: '' },
                          calcType: ['fixed', 'per_guest', 'service_pct', 'vat_pct'].includes(f.calcType) ? f.calcType : 'fixed',
                          amount: Number(f.amount) || 0,
                          sourceCurrency: f.sourceCurrency,
                          active: Boolean(f.active),
                        }))
                      : [],
                  };

                  const match = isUnknown ? { kind: 'none' } : window.__MERGE__.findSameVenue(this.venues, parsedName);
                  if (match.kind === 'exact') {
                    this.finishMerge(match.venue, window.__MERGE__.mergeVenue(match.venue, normalizedVenue));
                    lastAutoAttachMsg = `${this.t('toastMergedInto')} ${this.displayVenueName(match.venue)}`;
                  } else if (match.kind === 'similar') {
                    this.pendingVenueDocs.push({ id: uid, kind: 'similar', venue: normalizedVenue, candidateId: match.venue.id, fileName: file.name });
                    venueQueuedCount += 1;
                  } else if (isUnknown && this.venues.length > 0) {
                    this.pendingVenueDocs.push({ id: uid, kind: 'unnamed', venue: normalizedVenue, fileName: file.name });
                    venueQueuedCount += 1;
                  } else {
                    this.venues.push(normalizedVenue);
                    if (!isUnknown && parsedName.length >= 2) {
                      this.fetchVenuePhoto(normalizedVenue.id, false);
                    }
                    venueAddedCount += 1;
                  }
                }

                if (!targetVenueId && this.batchQueue[i]) {
                  this.batchQueue[i].status = 'done';
                }
                this.failedQueue = this.failedQueue.filter((f) => f.name !== file.name);
              } catch (err) {
                hasError = true;
                const errMsg = err instanceof Error ? err.message : 'Error';
                if (!targetVenueId && this.batchQueue[i]) {
                  this.batchQueue[i].status = 'error';
                  this.batchQueue[i].error = errMsg;
                }
                const existingFailed = this.failedQueue.find((f) => f.name === file.name);
                if (!existingFailed) {
                  this.failedQueue.push({ name: file.name, file, error: errMsg, targetVenueId });
                } else {
                  existingFailed.error = errMsg;
                  existingFailed.targetVenueId = targetVenueId;
                }
              }
            }

            setTimeout(() => {
              this.isScanning = false;
              this.cardScanningId = null;
              this.refreshIcons();

              if (currencyWarned) {
                this.showToast(this.t('toastCurrencyUnknown'));
              } else if (targetVenueId && vendorAutoAttachedCount > 0) {
                this.showToast(this.t('toastVendorAssigned'));
              } else if (lastAutoAttachMsg) {
                this.showToast(lastAutoAttachMsg);
              } else if (venueAddedCount > 0) {
                this.showToast(`${venueAddedCount} ${this.t('toastVenueAdded')}`);
                const target = document.getElementById('comparison-section');
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
              } else if (venueQueuedCount > 0) {
                const bar = document.getElementById('venue-decision-bar');
                if (bar) bar.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              } else if (vendorQueuedCount > 0) {
                const assignBar = document.getElementById('vendor-assignment-bar');
                if (assignBar) assignBar.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              } else if (hasError) {
                this.showToast(this.t('toastParseError'));
              }
            }, 300);
          },

          retryFailedFile(index) {
            const entry = this.failedQueue[index];
            if (!entry || !entry.file) return;
            const fileToRetry = entry.file;
            const targetId = entry.targetVenueId || null;
            this.failedQueue.splice(index, 1);
            this.processUploadedFiles([fileToRetry], targetId);
          },

          addManualFromFailed(index) {
            const entry = this.failedQueue[index];
            if (!entry) return;
            const uid = 'manual-' + Date.now() + '-' + index;
            const keys = ['lakeVilla', 'bosphorusPalace', 'tuscanEstate', 'modernAtelier'];
            this.venues.push({
              id: uid,
              name: '',
              nameUnknown: true,
              editing: true,
              showAddFlag: false,
              showUploadedPreview: false,
              uploadedPreviewUrl: '',
              realPhotoUrl: '',
              realPhotoSourceUrl: '',
              realPhotoSourceLabel: '',
              realPhotoError: false,
              photoStatus: 'idle',
              photoQueryKey: '',
              coverMode: 'auto',
              coverKey: keys[this.venues.length % keys.length],
              coverError: false,
              newFlag: { label: '', calcType: 'fixed', amount: '', category: '' },
              region: { tr: 'Manuel Giriş', en: 'Manual Entry' },
              venueType: { tr: 'Yüklenen Teklif', en: 'Uploaded Quote' },
              capacityLabel: { tr: 'Düzenlenebilir', en: 'Editable' },
              sourceLabel: {
                tr: `Dosya: ${entry.name} · Rakamları girin`,
                en: `File: ${entry.name} · Enter figures`,
              },
              ...window.__TERMS__.emptyTerms(),
              baseFeeEur: 0,
              fbPerPersonEur: 0,
              flags: [
                {
                  id: `${uid}-vat`,
                  type: 'risk',
                  label: { tr: 'KDV Hariçtir (+%20)', en: 'VAT Excluded (+20%)' },
                  detail: {
                    tr: 'Teklifte KDV hariç belirtildiyse açık bırakın.',
                    en: 'Keep active if your quote excludes VAT.',
                  },
                  calcType: 'vat_pct',
                  amount: 20,
                  active: false,
                },
              ],
            });
            this.failedQueue.splice(index, 1);
            this.refreshIcons();
            const target = document.getElementById('comparison-section');
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          },

          buildShareableSummaryText() {
            return window.__SUMMARY__.buildSummary({
              venues: this.venues,
              guestCount: this.guestCount,
              currency: this.currency,
              exchangeRate: this.exchangeRate,
              lang: this.lang,
            });
          },

          summaryRows(venue) {
            return window.__SUMMARY__.termRows(venue, { lang: this.lang, money: (eur) => this.formatCurrency(eur) });
          },

          summaryGaps(venue) {
            return window.__SUMMARY__.gapLines(venue, this.guestCount, { lang: this.lang, money: (eur) => this.formatCurrency(eur) });
          },

          copySummaryToClipboard() {
            const text = this.buildShareableSummaryText();
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(() => {
                this.copiedSummary = true;
                setTimeout(() => {
                  this.copiedSummary = false;
                }, 2500);
              });
            }
          },
        };
      }
    </script>
