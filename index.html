                        </span>
                        <span class="mt-0.5 text-xs text-stone transition-transform duration-150" :class="sectionOpen(venue, 'extras') ? '' : '-rotate-90'">▾</span>
                      </button>
                      <div x-show="sectionOpen(venue, 'extras')">

                      <p x-show="getActiveComparisonCategories().length === 0" class="mt-3 text-xs text-stone" x-text="t('noFlagsYet')"></p>

                      <div x-show="getActiveComparisonCategories().length > 0" class="mt-3 space-y-2.5">
                        <template x-for="cat in getActiveComparisonCategories()" :key="venue.id + '-cat-' + cat">
                          <div
                            x-show="getVenueFlagsByCategory(venue, cat).length > 0"
                            class="rounded-2xl border border-champagne-soft/90 bg-pearl/55 p-2.5 transition-colors"
                          >
                            <!-- Fixed-Order Category Slot Header -->
                            <div class="mb-2 flex items-center justify-between gap-2 px-1">
                              <span
                                class="inline-flex items-center rounded-full border border-champagne-line bg-white px-2.5 py-0.5 text-[10px] font-semibold text-obsidian"
                                x-text="getCategoryBadge(cat)"
                              ></span>

                            </div>

                            <!-- Case 1: Venue has 1+ items in this category -->
                            <ul x-show="getVenueFlagsByCategory(venue, cat).length > 0" class="space-y-2">
                              <template x-for="flag in getVenueFlagsByCategory(venue, cat)" :key="flag.id">
                                <li>
                                  <!-- Risk / Vendor Service Row with iOS Tactile Toggle -->
                                  <template x-if="flag.type === 'risk' && !needsPrice(flag)">
                                    <div
                                      class="rounded-xl border transition-colors duration-200"
                                      :class="flag.active ? (flag.vendorCategory ? 'border-champagne-line bg-blush/75 text-obsidian' : 'border-[#FECDD3] bg-peony-bg/75 text-[#9F1239]') : 'border-champagne-soft bg-white/75 opacity-75'"
                                    >
                                      <div class="flex items-center gap-2 px-3 py-2.5">
                                      <button
                                        type="button"
                                        role="switch"
                                        :aria-checked="flag.active"
                                        @click="toggleFlag(venue.id, flag.id)"
                                        class="flex flex-1 items-start justify-between gap-2.5 text-left"
                                      >
                                        <div class="flex items-start gap-2.5 min-w-0">
                                          <!-- iOS Tactile Toggle Switch -->
                                          <span
                                            class="mt-0.5 relative inline-flex h-5 w-9 shrink-0 items-center rounded-full p-0.5 transition-colors duration-200"
                                            :class="flag.active ? (flag.vendorCategory ? 'bg-obsidian' : 'bg-peony') : 'bg-[#DDD2CA]'"
                                          >
                                            <span
                                              class="inline-block h-4 w-4 rounded-full bg-white shadow-sm transition-transform duration-200"
                                              :class="flag.active ? 'translate-x-4' : 'translate-x-0'"
                                            ></span>
                                          </span>

                                          <div class="min-w-0">
                                            <div x-show="flag.vendorSourceFile" class="mb-0.5 truncate text-[10px] font-medium text-stone" x-text="flag.vendorSourceFile"></div>

                                            <div
                                              class="text-xs font-semibold leading-snug"
                                              :class="flag.active ? (flag.vendorCategory ? 'text-obsidian' : 'text-[#9F1239]') : 'text-stone line-through'"
                                              x-text="flag.label[lang]"
                                            ></div>

                                            <p x-show="flag.detail[lang]" :title="flag.detail[lang]" class="mt-0.5 line-clamp-2 text-[11px] leading-relaxed text-stone" x-text="flag.detail[lang]"></p>

                                            <!-- Smart Override Note -->
                                            <p
                                              x-show="!flag.active && flag.replacedBy"
                                              class="mt-1 text-[11px] font-semibold text-emeraldSafe"
                                              x-text="`${t('replacedByNote')}: ${flag.replacedBy}`"
                                            ></p>
                                          </div>
                                        </div>

                                        <span
                                          class="text-xs font-semibold tabular-nums whitespace-nowrap shrink-0 pt-0.5"
                                          :class="flag.active ? (flag.vendorCategory ? 'text-obsidian' : 'text-[#9F1239]') : 'text-stone'"
                                          x-text="flag.active ? `+${formatCurrency(getFlagAmountEur(venue, flag))}` : t('excludedLabel')"
                                        ></span>
                                      </button>

                                      <button
                                        type="button"
                                        @click="removeFlag(venue.id, flag.id)"
                                        :title="t('removeFlagLabel')"
                                        :aria-label="t('removeFlagLabel')"
                                        class="rounded-full p-1 text-stone/60 transition-colors hover:bg-white hover:text-peony shrink-0"
                                      >
                                        ×
                                      </button>
                                      </div>

                                      <!-- Edit mode: fix a misread name or amount -->
                                      <div x-show="venue.editing" x-cloak class="flex flex-wrap items-center gap-2 border-t border-champagne-soft/80 px-3 py-2">
                                        <input
                                          type="text"
                                          maxlength="80"
                                          x-model="flag.label[lang]"
                                          :aria-label="t('flagNameEditLabel')"
                                          class="min-w-0 flex-1 rounded-lg border border-champagne-line bg-white px-2 py-1 text-xs text-obsidian focus:border-champagne focus:outline-none"
                                        />
                                        <label class="flex items-center gap-1 text-[11px] text-stone">
                                          <input
                                            type="text"
                                            inputmode="decimal"
                                            :value="flagEditValue(flag)"
                                            @change="setFlagAmount(venue.id, flag.id, $event)"
                                            :aria-label="t('flagAmountEditLabel')"
                                            class="w-24 rounded-lg border border-champagne-line bg-white px-2 py-1 text-right text-xs tabular-nums text-obsidian focus:border-champagne focus:outline-none"
                                          />
                                          <span class="whitespace-nowrap" x-text="flagUnitText(flag)"></span>
                                        </label>
                                      </div>
                                    </div>
                                  </template>

                                  <!-- Required / excluded item with no stated price: ask the user -->
                                  <template x-if="flag.type === 'risk' && needsPrice(flag)">
                                    <div class="rounded-xl border border-dashed border-amber-300 bg-amber-50/70 px-3 py-2.5">
                                      <div class="flex items-start justify-between gap-2">
                                        <div class="min-w-0">
                                          <div class="text-xs font-semibold leading-snug text-amber-900" x-text="stripPriceNote(flag.label[lang])"></div>
                                          <p x-show="flag.detail[lang]" :title="flag.detail[lang]" class="mt-0.5 line-clamp-2 text-[11px] leading-relaxed text-amber-900/80" x-text="flag.detail[lang]"></p>
                                        </div>
                                        <div class="flex items-center gap-1.5 shrink-0">
                                          <span class="rounded-full bg-white/85 px-2.5 py-0.5 text-[11px] font-semibold text-amber-800 whitespace-nowrap" x-text="'? ' + t('flagNeedsPriceLabel')"></span>
                                          <button
                                            type="button"
                                            @click="removeFlag(venue.id, flag.id)"
                                            :title="t('removeFlagLabel')"
                                            :aria-label="t('removeFlagLabel')"
                                            class="rounded-full p-1 text-amber-800/60 transition-colors hover:bg-white hover:text-peony"
                                          >
                                            ×
                                          </button>
                                        </div>
                                      </div>
                                      <label class="mt-2 flex items-center gap-2 text-[11px] text-amber-900/80">
                                        <span x-text="flag.calcType === 'per_guest' ? t('flagPricePerGuest') : t('flagPriceLabel')"></span>
                                        <input
                                          type="number"
                                          min="0"
                                          step="50"
                                          :placeholder="currency === 'EUR' ? '€' : '₺'"
                                          @change="setFlagPrice(venue.id, flag.id, $event)"
                                          class="w-28 rounded-lg border border-amber-200 bg-white px-2 py-1 text-xs tabular-nums text-obsidian focus:border-champagne focus:outline-none"
                                        />
                                      </label>
                                    </div>
                                  </template>

                                  <!-- Restriction / condition with no price impact -->
                                  <template x-if="flag.type === 'info'">
                                    <div class="flex items-start justify-between gap-2 rounded-xl border border-champagne-soft bg-white/75 px-3 py-2.5">
                                      <div class="flex min-w-0 flex-1 items-start gap-2.5">
                                        <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-champagne-soft text-[11px] font-bold text-stone">i</span>
                                        <div class="min-w-0">
                                          <div class="text-xs font-semibold leading-snug text-obsidian" x-text="flag.label[lang]"></div>
                                          <p x-show="flag.detail[lang]" :title="flag.detail[lang]" class="mt-0.5 line-clamp-2 text-[11px] leading-relaxed text-stone" x-text="flag.detail[lang]"></p>
                                        </div>
                                      </div>
                                      <div class="flex items-center gap-1.5 shrink-0">
                                        <span class="rounded-full bg-champagne-soft px-2.5 py-0.5 text-[11px] font-semibold text-stone whitespace-nowrap" x-text="t('flagInfoLabel')"></span>
                                        <button
                                          type="button"
                                          @click="removeFlag(venue.id, flag.id)"
                                          :title="t('removeFlagLabel')"
                                          :aria-label="t('removeFlagLabel')"
                                          class="rounded-full p-1 text-stone/60 transition-colors hover:bg-white hover:text-peony"
                                        >
                                          ×
                                        </button>
                                      </div>
                                    </div>
                                  </template>

                                  <!-- Botanical Mint Included Safe Protection -->
                                  <template x-if="flag.type === 'safe'">
                                    <div class="flex items-center justify-between gap-2 rounded-xl border border-[#CCFBF1] bg-emeraldSafe-bg/85 px-3 py-2.5 text-[#115E59]">
                                      <div class="flex items-start gap-2.5 min-w-0 flex-1">
                                        <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-emeraldSafe/15 text-[11px] font-bold text-emeraldSafe">
                                          ✓
                                        </span>
                                        <div class="min-w-0">
                                          <div class="text-xs font-semibold text-[#115E59]" x-text="flag.label[lang]"></div>
                                          <p x-show="flag.detail[lang]" :title="flag.detail[lang]" class="mt-0.5 line-clamp-2 text-[11px] leading-relaxed text-[#115E59]/80" x-text="flag.detail[lang]"></p>
                                        </div>
                                      </div>
                                      <div class="flex items-center gap-1.5 shrink-0">
                                        <span class="rounded-full bg-white/85 px-2.5 py-0.5 text-[11px] font-semibold text-emeraldSafe whitespace-nowrap" x-text="t('includedLabel')"></span>
                                        <button
                                          type="button"
                                          @click="removeFlag(venue.id, flag.id)"
                                          :title="t('removeFlagLabel')"
                                          :aria-label="t('removeFlagLabel')"
                                          class="rounded-full p-1 text-emeraldSafe/60 transition-colors hover:bg-white hover:text-peony"
                                        >
                                          ×
                                        </button>
                                      </div>
                                    </div>
                                  </template>
                                </li>
                              </template>
                            </ul>
                          </div>
                        </template>

                        <!-- Categories this quote does not mention, collapsed into one line -->
                        <div x-show="missingCategories(venue).length > 0" class="rounded-2xl border border-dashed border-champagne-line bg-white/65 p-3">
                          <p class="text-[11px] font-medium text-stone" x-text="t('categoriesNotStated')"></p>
                          <div class="mt-2 flex flex-wrap gap-1.5">
                            <template x-for="cat in missingCategories(venue)" :key="venue.id + '-missing-' + cat">
                              <button
                                type="button"
                                @click="openAddFlagForCategory(venue.id, cat)"
                                class="inline-flex items-center gap-1 rounded-full border border-champagne-line bg-white px-2.5 py-1 text-[11px] font-semibold text-obsidian transition-colors hover:border-champagne hover:bg-blush"
                              >
                                <span x-text="getCategoryBadge(cat)"></span>
                                <span class="text-stone">+</span>
                              </button>
                            </template>
                          </div>
                        </div>
                      </div>

                      <!-- Add New Hidden Cost / VAT Item -->
                      <div class="mt-3.5">
                        <button
                          type="button"
                          x-show="!venue.showAddFlag"
                          @click="venue.newFlag = { label: '', calcType: 'fixed', amount: '', category: '' }; venue.showAddFlag = true"
                          class="text-xs font-medium text-obsidian underline-offset-4 hover:text-champagne hover:underline"
                          x-text="t('btnShowAddFlag')"
                        ></button>

                        <div x-show="venue.showAddFlag" x-cloak class="mt-2 space-y-2.5 rounded-2xl border border-champagne-line bg-blush/70 p-3.5 text-xs">
                          <input
                            type="text"
                            x-model="venue.newFlag.label"
                            :placeholder="t('newFlagLabelPlaceholder')"
                            class="w-full rounded-xl border border-champagne-line bg-white px-3 py-2 text-xs text-obsidian focus:border-champagne focus:outline-none"
                          />
                          <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
                            <select
                              x-model="venue.newFlag.category"
                              :aria-label="t('newFlagCategoryLabel')"
                              class="rounded-xl border border-champagne-line bg-white px-2.5 py-2 text-xs text-obsidian focus:border-champagne focus:outline-none"
                            >
                              <option value="" x-text="t('newFlagCategoryAuto')"></option>
                              <template x-for="catOpt in canonicalCategories" :key="'opt-' + catOpt">
                                <option :value="catOpt" x-text="getCategoryBadge(catOpt)"></option>
                              </template>
                            </select>
                            <select
                              x-model="venue.newFlag.calcType"
                              class="rounded-xl border border-champagne-line bg-white px-2.5 py-2 text-xs text-obsidian focus:border-champagne focus:outline-none"
                            >
                              <option value="fixed" x-text="t('newFlagTypeFixed')"></option>
                              <option value="per_guest" x-text="t('newFlagTypePerGuest')"></option>
                            <option value="service_pct" x-text="t('newFlagTypeService')"></option>
                            <option value="vat_pct" x-text="t('newFlagTypeVat')"></option>
                            </select>
                            <input
                              type="number"
                              min="0"
                              step="any"
                              x-model="venue.newFlag.amount"
                              :placeholder="t('newFlagAmountPlaceholder')"
                              class="rounded-xl border border-champagne-line bg-white px-3 py-2 text-xs font-semibold text-obsidian tabular-nums focus:border-champagne focus:outline-none"
                            />
                          </div>
                          <div class="flex items-center justify-end gap-2 pt-1">
                            <button
                              type="button"
                              @click="venue.showAddFlag = false"
                              class="rounded-full px-3 py-1.5 text-xs text-stone hover:text-obsidian"
                              x-text="t('btnCancelNewFlag')"
                            ></button>
                            <button
                              type="button"
                              @click="addCustomFlag(venue.id)"
                              class="rounded-full bg-obsidian px-4 py-1.5 text-xs font-medium text-pearl hover:bg-obsidian/90"
                              x-text="t('btnSaveNewFlag')"
                            ></button>
                          </div>
                        </div>
                      </div>

                      <!-- Feature A: Direct Per-Card Frosted Vendor Dropzone -->
                      <div
                        class="mt-4"
                        @dragover.prevent="dragOverVenueId = venue.id"
                        @dragleave.prevent="if (dragOverVenueId === venue.id) dragOverVenueId = null"
                        @drop.prevent="dragOverVenueId = null; handleCardDrop($event, venue.id)"
                      >
                        <input
                          type="file"
                          multiple
                          class="sr-only"
                          accept=".pdf,.png,.jpg,.jpeg,.webp"
                          :id="'card-upload-' + venue.id"
                          @change="handleCardFileInput($event, venue.id)"
                        />

                        <label
                          :for="'card-upload-' + venue.id"
                          class="flex cursor-pointer items-center justify-center rounded-2xl border px-4 py-3 text-center text-xs font-medium transition-all duration-200"
                          :class="dragOverVenueId === venue.id ? 'border-champagne bg-blush text-obsidian shadow-sm' : 'border-champagne-line bg-pearl/90 text-stone hover:border-champagne hover:bg-blush/60 hover:text-obsidian'"
                        >
                          <span x-show="cardScanningId !== venue.id" x-text="t('cardVendorDropCta')"></span>
                          <span x-show="cardScanningId === venue.id" class="inline-flex items-center gap-2 text-obsidian">
                            <i data-lucide="loader-2" class="h-3.5 w-3.5 animate-spin text-champagne"></i>
                            <span x-text="t('cardVendorScanning')"></span>
                          </span>
                        </label>
                      </div>
                      </div>
                    </div>
                  </div>
                </div>
              </article>
            </template>
          </div>

          <!-- Comparison matrix: equal-width columns, sticky header and first column, long text expands on demand -->
          <div x-show="showTable()" x-cloak class="mt-6">
            <p class="mb-3 text-[11px] leading-relaxed text-stone" x-text="t('matrixLegend')"></p>
            <div class="overflow-auto rounded-2xl border border-champagne-soft bg-white shadow-card" style="max-height: calc(100vh - var(--dock-h, 56px) - 1rem)">
              <table class="border-separate border-spacing-0 text-sm" :style="matrixStyle()">
                <caption class="sr-only" x-text="t('tableCaption')"></caption>
                <thead>
                  <tr>
                    <th scope="col" class="sticky left-0 top-0 z-30 w-[var(--mx-first)] min-w-[var(--mx-first)] border-b border-champagne-soft bg-pearl px-2 py-3 text-left sm:px-3 text-[11px] font-semibold uppercase tracking-wide text-stone" x-text="t('tableItemHeader')"></th>
                    <template x-for="col in matrix.columns" :key="col.id">
                      <th scope="col" class="sticky top-0 z-20 border-b border-l border-champagne-soft px-2 py-3 text-left align-top font-normal sm:px-3" :class="col.best ? 'bg-emeraldSafe-bg' : 'bg-white'">
                        <div class="flex items-start gap-2.5">
                          <img :src="getVenueCoverUrl(col.venue)" alt="" loading="lazy" class="hidden h-10 w-10 shrink-0 rounded-lg object-cover sm:block" />
                          <div class="min-w-0 flex-1">
                            <div class="line-clamp-2 font-serif text-base font-semibold leading-tight text-obsidian" :title="displayVenueName(col.venue)" x-text="displayVenueName(col.venue)"></div>
                            <div class="hidden truncate text-[11px] text-stone sm:block" x-text="col.venue.region[lang]"></div>
                          </div>
                          <button type="button" @click="openCard(col.id)" :title="t('tableEditShort')" :aria-label="t('tableEditShort')" class="shrink-0 rounded-full border border-champagne-line bg-white px-2 py-0.5 text-[11px] font-semibold text-obsidian transition-colors hover:border-champagne hover:bg-blush">✎</button>
                        </div>
                        <div x-show="col.hasPrice && !col.complete" class="mt-2 text-[10px] font-medium uppercase tracking-wide text-stone" x-text="t('fromPrefix')"></div>
                        <div class="flex flex-col gap-0.5 sm:flex-row sm:items-baseline sm:justify-between sm:gap-2" :class="col.hasPrice && !col.complete ? 'mt-0.5' : 'mt-2'">
                          <span class="font-serif text-xl font-semibold tabular-nums text-obsidian sm:text-2xl" x-text="col.hasPrice ? formatCurrency(col.turnkeyEur) : '—'"></span>
                          <span class="whitespace-nowrap text-[11px] tabular-nums text-stone" x-text="col.hasPrice ? formatCurrency(col.perGuestEur) + ' / ' + t('perGuestShort') : ''"></span>
                        </div>
                        <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
                          <span x-show="col.best" class="rounded-full bg-emeraldSafe/10 px-2 py-0.5 text-[10px] font-semibold text-emeraldSafe" x-text="t('bestValueBadgeShort')"></span>
                          <span x-show="col.gapCount > 0" :title="col.gapReasons.join(' · ')" class="cursor-help rounded-full bg-amber-50 px-2 py-0.5 text-[10px] font-semibold text-amber-800" x-text="'⚠ ' + col.gapCount + ' ' + t('gapWord')"></span>
                        </div>
                      </th>
                    </template>
                  </tr>
                </thead>

                <template x-for="group in matrix.groups" :key="group.key">
                  <tbody>
                    <tr>
                      <th scope="colgroup" :colspan="matrix.columns.length + 1" class="border-b border-champagne-soft bg-blush/70 px-3 py-1.5 text-left">
                        <button type="button" @click="toggleGroup(group.key)" :aria-expanded="!collapsedGroups[group.key]" class="sticky left-3 inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider text-stone hover:text-obsidian">
                          <span class="inline-block transition-transform duration-150" :class="collapsedGroups[group.key] ? '-rotate-90' : ''">▾</span>
                          <span x-text="group.label"></span>
                        </button>
                      </th>
                    </tr>
                    <template x-for="row in group.rows" :key="group.key + '-' + row.key">
                      <tr x-show="!collapsedGroups[group.key]">
                        <th scope="row" class="sticky left-0 z-10 border-b border-champagne-soft bg-pearl px-2 py-2.5 text-left text-xs font-medium text-stone sm:px-3" x-text="row.label"></th>
                        <template x-for="cell in row.cells" :key="row.key + '-' + cell.colId">
                          <td class="border-b border-l border-champagne-soft px-2 py-2.5 align-top text-[13px] sm:px-3" :class="cell.best ? 'bg-emeraldSafe-bg' : (cell.colBest ? 'bg-emeraldSafe-bg/40' : '')">
                            <template x-if="cell.kind === 'missing' || cell.kind === 'dash'">
                              <span class="text-stone/40" :title="cell.kind === 'missing' ? t('termsNotStated') : ''">—</span>
                            </template>
                            <template x-if="cell.kind === 'amount'">
                              <span class="font-medium tabular-nums" :class="cell.warn ? 'text-amber-800' : 'text-obsidian'" :title="cell.warn ? t('termsBelowMinimum') : ''" x-text="(cell.warn ? '⚠ ' : '') + cell.text"></span>
                            </template>
                            <template x-if="cell.kind === 'included'">
                              <span class="font-medium text-emeraldSafe" x-text="'✓ ' + cell.text"></span>
                            </template>
                            <template x-if="cell.kind === 'excluded'">
                              <span class="text-stone" x-text="cell.text"></span>
                            </template>
                            <template x-if="cell.kind === 'needs_price'">
                              <span class="text-[12px] font-medium text-amber-700" x-text="'● ' + cell.text"></span>
                            </template>
                            <template x-if="cell.kind === 'text'">
                              <div>
                                <p class="leading-snug" :class="[cell.long && !isExpanded(row.key, cell.colId) ? 'line-clamp-2' : '', cell.expired ? 'font-semibold text-peony' : 'text-obsidian']" :title="cell.long ? cell.text : ''" x-text="cell.text"></p>
                                <button type="button" x-show="cell.long" @click="toggleExpand(row.key, cell.colId)" class="mt-0.5 text-[11px] font-medium text-champagne hover:text-obsidian" x-text="isExpanded(row.key, cell.colId) ? t('matrixLess') : t('matrixMore')"></button>
                              </div>
                            </template>
                          </td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </template>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Minimal Editorial Footer -->
    <footer class="border-t border-champagne-soft bg-pearl/80">
      <div class="mx-auto flex max-w-7xl flex-col items-start justify-between gap-4 px-5 py-7 text-xs text-stone sm:flex-row sm:items-center sm:px-8">
        <span class="font-serif text-base font-medium text-obsidian">Wedding Quote Decoder</span>
        <span x-text="t('footerTagline')"></span>
      </div>
    </footer>

    <!-- Partner Shareable Summary Modal -->
    <div
      x-show="showSummaryModal"
      x-cloak
      x-transition.opacity.duration.200ms
      class="fixed inset-0 z-50 flex items-center justify-center bg-obsidian/45 p-4 backdrop-blur-sm"
      @keydown.escape.window="showSummaryModal = false"
      role="dialog"
      aria-modal="true"
      aria-labelledby="summary-modal-title"
    >
      <div
        @click.outside="showSummaryModal = false"
        class="max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-[28px] border border-champagne-line bg-pearl p-6 shadow-atelier sm:p-8"
      >
        <div class="flex items-start justify-between gap-4 border-b border-champagne-soft pb-4">
          <div>
            <p class="text-xs font-medium tracking-[0.16em] uppercase text-stone" x-text="t('modalKicker')"></p>
            <h3 id="summary-modal-title" class="mt-1 font-serif text-3xl font-medium text-obsidian" x-text="t('modalTitle')"></h3>
          </div>
          <button
            type="button"
            @click="showSummaryModal = false"
            class="rounded-full p-2 text-stone hover:bg-white hover:text-obsidian"
            :aria-label="t('modalClose')"
          >
            <i data-lucide="x" class="h-5 w-5"></i>
          </button>
        </div>

        <div class="mt-5 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-stone">
          <span>
            <span x-text="t('modalGuests')"></span>
            <strong class="font-semibold text-obsidian tabular-nums" x-text="`${guestCount} ${t('guestUnit')}`"></strong>
          </span>
          <span aria-hidden="true">·</span>
          <span>
            <span x-text="t('modalCurrency')"></span>
            <strong class="font-semibold text-obsidian" x-text="currency"></strong>
          </span>
          <span aria-hidden="true">·</span>
          <span class="tabular-nums" x-text="`${t('refRateLabel')} ${exchangeRate} ₺ · ${rateSourceText()}`"></span>
        </div>

        <div class="mt-5 space-y-4">
          <template x-for="venue in venues" :key="'sum-' + venue.id">
            <div class="rounded-2xl border border-champagne-soft bg-white/95 p-5">
              <div class="flex flex-wrap items-baseline justify-between gap-2">
                <div>
                  <h4 class="font-serif text-xl font-semibold text-obsidian" x-text="displayVenueName(venue)"></h4>
                  <p class="text-xs text-stone" x-text="venue.region[lang]"></p>
                </div>
                <div class="text-right">
                  <div class="font-serif text-2xl font-semibold text-obsidian tabular-nums" x-text="formatCurrency(calculateBreakdown(venue).turnkeyTotalEur)"></div>
                  <div class="text-[11px] text-stone tabular-nums" x-text="`${formatCurrency(calculateBreakdown(venue).effectivePerGuestEur)} / ${t('perGuestShort')}`"></div>
                </div>
              </div>

              <div class="mt-3 grid grid-cols-3 gap-2 border-t border-champagne-soft pt-3 text-xs">
                <div>
                  <span class="block text-stone" x-text="t('modalBaseRent')"></span>
                  <span class="font-semibold text-obsidian tabular-nums" x-text="formatCurrency(venue.baseFeeEur)"></span>
                </div>
                <div>
                  <span class="block text-stone" x-text="t('modalFbTotal')"></span>
                  <span class="font-semibold text-obsidian tabular-nums" x-text="formatCurrency(calculateBreakdown(venue).fbSubtotalEur)"></span>
                </div>
                <div>
                  <span class="block text-stone" x-text="t('modalHiddenVat')"></span>
                  <span class="font-semibold text-peony tabular-nums" x-text="formatCurrency(calculateBreakdown(venue).hiddenExtrasTotalEur)"></span>
                </div>
              </div>

              <dl x-show="summaryRows(venue).length > 0" class="mt-3 space-y-1 border-t border-champagne-soft pt-3 text-xs">
                <template x-for="row in summaryRows(venue)" :key="row[0]">
                  <div class="flex items-start justify-between gap-3">
                    <dt class="text-stone" x-text="row[0]"></dt>
                    <dd class="text-right font-medium text-obsidian" x-text="row[1]"></dd>
                  </div>
                </template>
              </dl>

              <p x-show="summaryGaps(venue).missing.length > 0" class="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-xs leading-relaxed text-amber-800" x-text="'⚠ ' + t('summaryMissingTitle') + ': ' + summaryGaps(venue).missing.join('; ')"></p>
              <p x-show="summaryGaps(venue).asks.length > 0" class="mt-2 text-xs leading-relaxed text-stone" x-text="'? ' + t('summaryAskTitle') + ': ' + summaryGaps(venue).asks.join(', ')"></p>
            </div>
          </template>
        </div>

        <div class="mt-6 flex flex-wrap items-center justify-end gap-3 border-t border-champagne-soft pt-5 no-print">
          <button
            type="button"
            @click="window.print()"
            class="inline-flex items-center gap-2 rounded-full border border-champagne-line bg-white px-5 py-2.5 text-sm font-medium text-obsidian transition-colors hover:border-champagne whitespace-nowrap shrink-0"
          >
            <i data-lucide="printer" class="h-4 w-4"></i>
            <span x-text="t('btnPrintPdf')"></span>
          </button>

          <button
            type="button"
            @click="copySummaryToClipboard()"
            class="inline-flex items-center gap-2 rounded-full bg-obsidian px-5 py-2.5 text-sm font-medium text-pearl transition-colors hover:bg-obsidian/90 whitespace-nowrap shrink-0"
          >
            <i data-lucide="copy" class="h-4 w-4 text-champagne"></i>
            <span x-text="copiedSummary ? t('btnCopiedSummary') : t('btnCopySummary')"></span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
