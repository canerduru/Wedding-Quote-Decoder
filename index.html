                        class="rounded-full border border-champagne-line bg-pearl px-3.5 py-1.5 text-xs font-medium text-obsidian transition-colors hover:border-champagne whitespace-nowrap shrink-0"
                        x-text="t('btnAddManual')"
                      ></button>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </div>

          <!-- Real Multi-File AI OCR Scanning Queue -->
          <div x-show="isScanning" x-cloak class="mx-auto max-w-xl py-4 text-center">
            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full border border-champagne-line bg-blush text-obsidian">
              <i data-lucide="loader-2" class="h-5 w-5 animate-spin text-champagne"></i>
            </div>
            <p class="mt-4 font-serif text-2xl font-medium text-obsidian" x-text="t('ocrTitle')"></p>

            <ul class="mt-5 divide-y divide-champagne-soft rounded-2xl border border-champagne-line bg-white/95 text-left text-xs">
              <template x-for="(item, idx) in batchQueue" :key="idx">
                <li class="flex items-center justify-between gap-4 px-4 py-3.5">
                  <div class="min-w-0">
                    <div class="truncate font-medium text-obsidian" x-text="item.name"></div>
                    <div x-show="item.error" class="mt-0.5 text-[11px] text-peony" x-text="item.error"></div>
                  </div>
                  <span
                    class="shrink-0 font-semibold whitespace-nowrap"
                    :class="item.status === 'done' ? 'text-emeraldSafe' : (item.status === 'error' ? 'text-peony' : (item.status === 'scanning' ? 'text-obsidian' : 'text-stone'))"
                    x-text="item.status === 'done' ? t('ocrStatusDone') : (item.status === 'error' ? t('ocrStatusError') : (item.status === 'scanning' ? t('ocrStatusScanning') : t('ocrStatusPending')))"
                  ></span>
                </li>
              </template>
            </ul>
          </div>
        </div>

        <!-- Feature C: 1-Click Vendor Assignment Bar (Visible when pendingVendorAddons.length > 0) -->
        <div
          id="vendor-assignment-bar"
          x-show="pendingVendorAddons.length > 0"
          x-cloak
          x-transition.opacity.duration.200ms
          class="mx-auto mt-6 max-w-5xl space-y-3"
        >
          <template x-for="addon in pendingVendorAddons" :key="addon.id">
            <div class="rounded-[24px] border border-champagne-line bg-white/90 p-5 shadow-card backdrop-blur-lg sm:p-6">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <div class="flex flex-wrap items-center gap-2 text-xs font-semibold">
                    <span class="rounded-full border border-champagne-line bg-blush px-2.5 py-0.5 text-obsidian" x-text="getCategoryBadge(addon.vendorCategory)"></span>
                    <span class="uppercase tracking-wider text-stone" x-text="t('vendorAssignKicker')"></span>
                  </div>
                  <p class="mt-2 font-serif text-xl font-medium text-obsidian sm:text-2xl">
                    <span x-text="getCategoryFullTitle(addon.vendorCategory)"></span>
                    <span x-show="addon.vendorName" class="text-stone" x-text="`— ${addon.vendorName}`"></span>
                    <span class="font-semibold tabular-nums" x-text="`(${formatCurrency(estimateAddonTotalEur(addon))})`"></span>
                    <span x-text="t('vendorAssignQuestionTail')"></span>
                  </p>
                  <p class="mt-1 text-xs text-stone" x-text="addon.fileName"></p>
                </div>

                <button
                  type="button"
                  @click="dismissPendingVendor(addon.id)"
                  :title="t('vendorAssignDismiss')"
                  :aria-label="t('vendorAssignDismiss')"
                  class="rounded-full p-2 text-stone/70 transition-colors hover:bg-peony-bg hover:text-peony shrink-0"
                >
                  <i data-lucide="x" class="h-4 w-4"></i>
                </button>
              </div>

              <p x-show="venues.length === 0" class="mt-3 text-xs text-stone" x-text="t('vendorAssignWaitingNote')"></p>

              <!-- 1-Click Pill Action Buttons -->
              <div class="mt-4 flex flex-wrap items-center gap-2">
                <template x-for="v in venues" :key="'assign-' + addon.id + '-' + v.id">
                  <button
                    type="button"
                    @click="assignPendingToSingle(addon.id, v.id)"
                    class="rounded-full border border-champagne-line bg-pearl px-4 py-2 text-xs font-semibold text-obsidian transition-colors hover:border-champagne hover:bg-white whitespace-nowrap shrink-0"
                    x-text="`${t('vendorAssignOnlyPrefix')} ${displayVenueName(v)}`"
                  ></button>
                </template>

                <button
                  type="button"
                  x-show="venues.length > 0"
                  @click="assignPendingToMissing(addon.id)"
                  class="rounded-full border border-[#CCFBF1] bg-emeraldSafe-bg px-4 py-2 text-xs font-semibold text-emeraldSafe transition-colors hover:bg-emeraldSafe hover:text-white whitespace-nowrap shrink-0"
                  x-text="t('vendorAssignMissing')"
                ></button>

                <button
                  type="button"
                  x-show="venues.length > 1"
                  @click="assignPendingToAll(addon.id)"
                  class="rounded-full bg-obsidian px-4 py-2 text-xs font-semibold text-pearl transition-colors hover:bg-obsidian/90 whitespace-nowrap shrink-0"
                  x-text="t('vendorAssignAll')"
                ></button>

                <button
                  type="button"
                  @click="convertPendingToStandalone(addon.id)"
                  class="rounded-full px-3.5 py-2 text-xs font-medium text-stone underline-offset-4 hover:text-obsidian hover:underline whitespace-nowrap shrink-0"
                  x-text="t('vendorAssignStandalone')"
                ></button>
              </div>
            </div>
          </template>
        </div>

        <!-- Same-venue decisions: similar names and unnamed documents -->
        <div id="venue-decision-bar" x-show="pendingVenueDocs.length > 0" x-cloak class="mx-auto mt-6 max-w-5xl space-y-3">
          <template x-for="doc in pendingVenueDocs" :key="doc.id">
            <div class="rounded-[24px] border border-champagne-line bg-white/90 p-5 shadow-card backdrop-blur-lg sm:p-6">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <div class="text-xs font-semibold uppercase tracking-wider text-stone" x-text="doc.kind === 'similar' ? t('venueSimilarKicker') : t('venueUnnamedKicker')"></div>
                  <p class="mt-2 font-serif text-xl font-medium text-obsidian sm:text-2xl" x-text="doc.kind === 'similar' ? similarQuestion(doc) : t('venueUnnamedQ')"></p>
                  <p class="mt-1 text-xs text-stone" x-text="doc.fileName"></p>
                </div>
                <button
                  type="button"
                  @click="dismissPendingVenue(doc.id)"
                  :title="t('vendorAssignDismiss')"
                  :aria-label="t('vendorAssignDismiss')"
                  class="rounded-full p-2 text-stone/70 transition-colors hover:bg-peony-bg hover:text-peony shrink-0"
                >
                  ×
                </button>
              </div>

              <div class="mt-4 flex flex-wrap items-center gap-2">
                <template x-if="doc.kind === 'similar'">
                  <div class="flex flex-wrap items-center gap-2">
                    <button type="button" @click="confirmPendingVenue(doc.id, doc.candidateId)" class="rounded-full bg-obsidian px-4 py-2 text-xs font-semibold text-pearl transition-colors hover:bg-obsidian/90 whitespace-nowrap" x-text="t('venueSimilarYes')"></button>
                    <button type="button" @click="keepPendingSeparate(doc.id)" class="rounded-full border border-champagne-line bg-pearl px-4 py-2 text-xs font-semibold text-obsidian transition-colors hover:border-champagne hover:bg-white whitespace-nowrap" x-text="t('venueSimilarNo')"></button>
                  </div>
                </template>
                <template x-if="doc.kind === 'unnamed'">
                  <div class="flex flex-wrap items-center gap-2">
                    <template x-for="v in venues" :key="'unnamed-' + doc.id + '-' + v.id">
                      <button type="button" @click="confirmPendingVenue(doc.id, v.id)" class="rounded-full border border-champagne-line bg-pearl px-4 py-2 text-xs font-semibold text-obsidian transition-colors hover:border-champagne hover:bg-white whitespace-nowrap" x-text="`${t('venueAddTo')} ${displayVenueName(v)}`"></button>
                    </template>
                    <button type="button" @click="keepPendingSeparate(doc.id)" class="rounded-full px-3.5 py-2 text-xs font-medium text-stone underline-offset-4 hover:text-obsidian hover:underline whitespace-nowrap" x-text="t('venueOpenSeparate')"></button>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- 2. Sticky Floating Glass Equalizer Dock -->
      <section
        id="equalizer-bar"
        class="sticky top-0 z-30 border-y border-champagne-soft bg-white/80 backdrop-blur-xl"
      >
        <div class="mx-auto flex max-w-7xl flex-col gap-2 px-5 py-2 sm:gap-3 sm:px-8 sm:py-3.5 lg:flex-row lg:items-center lg:justify-between lg:gap-6">
          <!-- Guest Count Slider (10 - 1000) -->
          <div class="flex flex-1 flex-row items-center gap-3 sm:gap-5">
            <div class="flex items-center justify-start gap-3 shrink-0">
              <label for="guestSlider" class="hidden text-xs font-semibold tracking-wide uppercase text-stone whitespace-nowrap sm:inline" x-text="t('guestLabel')"></label>
              <div class="flex items-baseline gap-1.5">
                <input
                  type="number"
                  inputmode="numeric"
                  min="10"
                  max="1000"
                  :value="guestCount"
                  @change="setGuests($event)"
                  :aria-label="t('guestLabel')"
                  class="w-[4.5ch] border-b border-transparent bg-transparent text-right font-serif text-2xl font-semibold text-obsidian tabular-nums transition-colors hover:border-champagne focus:border-champagne focus:outline-none [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
                />
                <span class="text-xs text-stone" x-text="t('guestUnit')"></span>
              </div>
            </div>

            <div class="flex flex-1 items-center gap-3">
              <span class="hidden text-[11px] font-medium text-stone tabular-nums sm:inline">10</span>
              <input
                id="guestSlider"
                type="range"
                min="10"
                max="1000"
                step="5"
                x-model.number="guestCount"
                :style="getSliderProgressStyle()"
                class="atelier-slider w-full"
                :aria-label="t('guestLabel')"
              />
              <span class="hidden text-[11px] font-medium text-stone tabular-nums sm:inline">1000</span>
            </div>
          </div>

          <!-- Currency Toggle, Language Toggle & Reference Rate -->
          <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-2 border-t border-champagne-soft pt-1.5 sm:pt-2 lg:border-t-0 lg:pt-0">
            <label class="hidden items-center gap-1.5 text-xs text-stone xl:flex">
              <span x-text="t('refRateLabel')"></span>
              <input
                type="text"
                inputmode="decimal"
                :value="exchangeRate"
                @change="setTryRate($event)"
                :aria-label="t('rateInputLabel')"
                class="w-20 rounded-lg border border-champagne-line bg-white px-2 py-1 text-right text-xs tabular-nums text-obsidian focus:border-champagne focus:outline-none"
              />
              <span>₺</span>
              <span class="hidden text-[11px] 2xl:inline" x-text="'· ' + rateSourceText()"></span>
            </label>

            <div class="flex flex-wrap items-center gap-2.5 sm:gap-3">
              <span class="hidden text-xs text-stone whitespace-nowrap sm:inline">
                <strong class="font-semibold text-obsidian tabular-nums" x-text="venues.length"></strong>
                <span x-text="t('activeVenuesLabel')"></span>
              </span>

              <!-- Segmented Currency Pill Control -->
              <div class="inline-flex items-center rounded-full border border-champagne-line bg-blush/90 p-0.5" role="group" aria-label="Currency">
                <button
                  type="button"
                  @click="currency = 'EUR'"
                  :class="currency === 'EUR' ? 'bg-obsidian text-pearl shadow-sm' : 'text-stone hover:text-obsidian'"
                  class="rounded-full px-3 py-1 text-xs font-semibold transition-all duration-200 whitespace-nowrap shrink-0 sm:px-3.5"
                >
                  EUR (€)
                </button>
                <button
                  type="button"
                  @click="currency = 'TRY'"
                  :class="currency === 'TRY' ? 'bg-obsidian text-pearl shadow-sm' : 'text-stone hover:text-obsidian'"
                  class="rounded-full px-3 py-1 text-xs font-semibold transition-all duration-200 whitespace-nowrap shrink-0 sm:px-3.5"
                >
                  TRY (₺)
                </button>
              </div>

              <!-- Segmented Language Pill Toggle -->
              <div class="inline-flex items-center rounded-full border border-champagne-line bg-blush/90 p-0.5" role="group" aria-label="Language">
                <button
                  type="button"
                  @click="setLang('tr')"
                  :class="lang === 'tr' ? 'bg-obsidian text-pearl shadow-sm' : 'text-stone hover:text-obsidian'"
                  class="rounded-full px-2.5 py-1 text-xs font-semibold transition-all duration-200 whitespace-nowrap shrink-0"
                >
                  TR
                </button>
                <button
                  type="button"
                  @click="setLang('en')"
                  :class="lang === 'en' ? 'bg-obsidian text-pearl shadow-sm' : 'text-stone hover:text-obsidian'"
                  class="rounded-full px-2.5 py-1 text-xs font-semibold transition-all duration-200 whitespace-nowrap shrink-0"
                >
                  EN
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 3. User-Uploaded Venues Side-by-Side Comparison Workspace -->
      <section id="comparison-section" class="mx-auto max-w-7xl scroll-mt-14 px-5 py-6 sm:px-8 sm:py-8">
        <!-- Empty State: 3 Editorial Glass Onboarding Cards + Live Sample CTA -->
        <div x-show="venues.length === 0">
          <div class="mx-auto max-w-2xl text-center">
            <h2 class="font-serif text-3xl font-medium tracking-tight text-obsidian sm:text-4xl" x-text="t('guideTitle')"></h2>
            <p class="mt-2.5 text-sm leading-relaxed text-stone sm:text-base" x-text="t('guideSubtitle')"></p>
          </div>

          <div class="mt-9 grid grid-cols-1 gap-6 md:grid-cols-3">
            <div class="rounded-[24px] border border-champagne-line bg-white/80 p-7 backdrop-blur-md shadow-card">
              <div class="flex items-baseline justify-between gap-2">
                <span class="font-serif text-4xl italic font-normal text-champagne/80">01</span>
                <span class="text-[11px] font-semibold tracking-wider uppercase text-stone" x-text="t('guideStep1Kicker')"></span>
              </div>
              <h3 class="mt-4 font-serif text-2xl font-medium text-obsidian" x-text="t('guideStep1Title')"></h3>
              <p class="mt-2 text-sm leading-relaxed text-stone" x-text="t('guideStep1Body')"></p>
            </div>

            <div class="rounded-[24px] border border-champagne-line bg-white/80 p-7 backdrop-blur-md shadow-card">
              <div class="flex items-baseline justify-between gap-2">
                <span class="font-serif text-4xl italic font-normal text-champagne/80">02</span>
                <span class="text-[11px] font-semibold tracking-wider uppercase text-stone" x-text="t('guideStep2Kicker')"></span>
              </div>
              <h3 class="mt-4 font-serif text-2xl font-medium text-obsidian" x-text="t('guideStep2Title')"></h3>
              <p class="mt-2 text-sm leading-relaxed text-stone" x-text="t('guideStep2Body')"></p>
            </div>

            <div class="rounded-[24px] border border-champagne-line bg-white/80 p-7 backdrop-blur-md shadow-card">
              <div class="flex items-baseline justify-between gap-2">
                <span class="font-serif text-4xl italic font-normal text-champagne/80">03</span>
                <span class="text-[11px] font-semibold tracking-wider uppercase text-stone" x-text="t('guideStep3Kicker')"></span>
              </div>
              <h3 class="mt-4 font-serif text-2xl font-medium text-obsidian" x-text="t('guideStep3Title')"></h3>
              <p class="mt-2 text-sm leading-relaxed text-stone" x-text="t('guideStep3Body')"></p>
            </div>
          </div>

          <div class="mt-9 flex flex-wrap items-center justify-center gap-3">
            <label
              for="quoteFileInput"
              class="inline-flex cursor-pointer items-center gap-2 rounded-full bg-obsidian px-6 py-3 text-sm font-medium text-pearl transition-all duration-200 hover:bg-obsidian/90 whitespace-nowrap shrink-0"
            >
              <i data-lucide="upload" class="h-4 w-4 text-champagne"></i>
              <span x-text="t('btnChooseFile')"></span>
            </label>

            <button
              type="button"
              @click="addBlankManualVenue()"
              class="rounded-full border border-champagne-line bg-white px-5 py-3 text-sm font-medium text-obsidian transition-colors hover:border-champagne whitespace-nowrap shrink-0"
              x-text="t('btnAddBlankVenue')"
            ></button>
          </div>
        </div>

        <!-- Populated State: Header & Dynamic Atelier Cards Grid -->
        <div x-show="venues.length > 0" x-cloak>
          <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <h2 class="font-serif text-2xl font-medium tracking-tight text-obsidian sm:text-3xl" x-text="t('comparisonTitle')"></h2>
              <p class="mt-0.5 text-xs text-stone">
                <span x-show="lang === 'en'">For </span>
                <span class="tabular-nums font-semibold text-obsidian" x-text="guestCount"></span>
                <span x-text="t('comparisonSubtitleTail')"></span>
              </p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <div
                x-show="venues.length >= 2"
                class="inline-flex items-center rounded-full border border-champagne-line bg-white/80 p-1"
                role="group"
                :aria-label="t('viewSwitchLabel')"
              >
                <button
                  type="button"
                  @click="setViewMode('cards')"
                  :aria-pressed="viewMode === 'cards'"
                  :class="viewMode === 'cards' ? 'bg-obsidian text-pearl shadow-sm' : 'text-stone hover:text-obsidian'"
                  class="rounded-full px-3.5 py-1.5 text-xs font-semibold transition-all duration-200 whitespace-nowrap"
                  x-text="t('viewCards')"
                ></button>
                <button
                  type="button"
                  @click="setViewMode('table')"
                  :aria-pressed="viewMode === 'table'"
                  :class="viewMode === 'table' ? 'bg-obsidian text-pearl shadow-sm' : 'text-stone hover:text-obsidian'"
                  class="rounded-full px-3.5 py-1.5 text-xs font-semibold transition-all duration-200 whitespace-nowrap"
                  x-text="t('viewTable')"
                ></button>
              </div>
              <button
                type="button"
                x-show="venues.length >= 2 && viewMode === 'cards'"
                @click="toggleAllCards()"
                :aria-pressed="cardsOpen"
                class="rounded-full border border-champagne-line bg-white/80 px-3.5 py-2 text-xs font-semibold text-obsidian transition-colors hover:border-champagne whitespace-nowrap"
                x-text="cardsOpen ? t('cardsCollapseAll') : t('cardsExpandAll')"
              ></button>
              <div
                x-show="venues.length >= 2 && viewMode === 'cards' && !allCollapsed()"
                class="inline-flex items-center rounded-full border border-champagne-line bg-white/80 p-1"
                role="group"
                :aria-label="t('densityLabel')"
              >
                <template x-for="option in [['large', 'densityLarge'], ['medium', 'densityMedium'], ['small', 'densitySmall']]" :key="option[0]">
                  <button
                    type="button"
                    @click="setDensity(option[0])"
                    :aria-pressed="density === option[0]"
                    :title="t('densityLabel')"
                    :class="density === option[0] ? 'bg-obsidian text-pearl shadow-sm' : 'text-stone hover:text-obsidian'"
                    class="rounded-full px-3 py-1.5 text-xs font-semibold transition-all duration-200 whitespace-nowrap"
                    x-text="t(option[1])"
                  ></button>
                </template>
              </div>
              <p x-show="!showTable()" class="text-xs text-stone" x-text="t('comparisonHint')"></p>
            </div>
          </div>

          <p
            x-show="lowestUnknownCount() > 0"
            class="mt-3 text-xs text-amber-800"
            x-text="`${t('lowestUnknownPrefix')} ${lowestUnknownCount()} ${t('lowestUnknownTail')}`"
          ></p>

          <!-- Dynamic Venue Comparison Grid -->
          <div
            x-show="!showTable()"
            data-card-grid
            class="mt-8 grid grid-cols-1 items-start"
            :class="[venues.length < 2 ? 'max-w-2xl' : '', allCollapsed() ? 'gap-4' : 'gap-7']"
            :style="gridStyle()"
          >
            <template x-for="(venue, index) in venues" :key="venue.id">
              <article
                :id="'venue-card-' + venue.id"
                class="flex flex-col justify-between overflow-hidden rounded-[24px] border bg-white shadow-card transition-all duration-200"
                :class="[isBestValue(venue) ? 'border-emeraldSafe/45 ring-1 ring-champagne/30' : 'border-champagne-soft', dragCardClass(venue, index)]"
                :style="dragCardStyle(venue)"
              >
                <!-- Compact summary: shown while the card is closed -->
                <div x-show="!isCardOpen(venue)" x-cloak>
                  <div class="relative h-20 w-full overflow-hidden bg-gradient-to-br from-[#F9F3F0] via-[#EFE6E0] to-[#E5D7CC]">
                    <img
                      x-show="!venue.coverError && getVenueCoverUrl(venue)"
                      :src="getVenueCoverUrl(venue)"
                      :alt="displayVenueName(venue)"
                      referrerPolicy="no-referrer"
                      @error="handleCoverImgError(venue)"
                      class="h-full w-full"
                      :class="getActiveCoverKind(venue) === 'quote' ? 'object-contain bg-obsidian' : 'object-cover'"
                    />
                    <button
                      type="button"
                      @pointerdown.prevent="startDrag($event, venue)"
                      x-show="canReorder()"
                      :title="t('dragHandleLabel')"
                      :aria-label="t('dragHandleLabel')"
                      class="absolute left-2.5 top-2.5 flex h-7 w-7 cursor-grab touch-none items-center justify-center rounded-full border border-white/25 bg-obsidian/65 text-pearl backdrop-blur-md active:cursor-grabbing"
                    >
                      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/>
                        <circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/>
                        <circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/>
                      </svg>
                    </button>
                  </div>
                  <button
                    type="button"
                    @click="toggleCard(venue)"
                    :aria-expanded="isCardOpen(venue)"
                    :title="t('cardExpand')"
                    :aria-label="t('cardExpand') + ': ' + displayVenueName(venue)"
                    class="block w-full px-4 pb-4 pt-3 text-left"
                  >
                    <span class="flex items-start justify-between gap-2">
                      <span class="block min-w-0 line-clamp-2 font-serif text-lg font-semibold leading-tight text-obsidian" x-text="displayVenueName(venue)"></span>
                      <svg class="mt-1 h-4 w-4 shrink-0 text-stone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                    </span>
                    <span class="mt-2 block font-serif text-2xl font-semibold tabular-nums text-obsidian">
                      <span x-show="isEstimate(venue)" class="mr-1 font-sans text-[11px] font-normal text-stone" x-text="t('fromPrefix')"></span>
                      <span x-show="cardSummaryOf(venue).totalEur > 0" x-text="formatCurrency(cardSummaryOf(venue).totalEur)"></span>
                      <span x-show="!(cardSummaryOf(venue).totalEur > 0)" class="font-sans text-base font-normal text-stone/50">—</span>
                    </span>
                    <span
                      x-show="cardSummaryOf(venue).totalEur > 0"
                      class="block text-[11px] tabular-nums text-stone"
                      x-text="`${formatCurrency(cardSummaryOf(venue).perGuestEur)} / ${t('perGuestShort')}`"
                    ></span>
                    <span class="mt-3 flex flex-wrap items-center gap-1.5">
                      <span
                        x-show="isBestValue(venue)"
                        class="rounded-full border border-champagne/60 bg-emeraldSafe-bg/95 px-2.5 py-0.5 text-[11px] font-semibold text-emeraldSafe whitespace-nowrap"
                        x-text="t('bestValueBadgeShort')"
                      ></span>
                      <span
                        x-show="!isBestValue(venue) && getDeltaFromLowest(venue) > 0"
                        class="rounded-full border border-champagne-line bg-pearl px-2.5 py-0.5 text-[11px] font-medium tabular-nums text-stone whitespace-nowrap"
                        x-text="`+${formatCurrency(getDeltaFromLowest(venue))}`"
                      ></span>
                      <span
                        x-show="cardSummaryOf(venue).included > 0"
                        class="rounded-full border border-champagne-line bg-white px-2.5 py-0.5 text-[11px] font-medium text-obsidian whitespace-nowrap"
                        x-text="`${cardSummaryOf(venue).included} ${t('includedCountLabel')}`"
                      ></span>
                      <span
                        x-show="cardSummaryOf(venue).gaps > 0"
                        class="rounded-full border border-amber-300 bg-amber-50 px-2.5 py-0.5 text-[11px] font-medium text-amber-900 whitespace-nowrap"
                        x-text="`${cardSummaryOf(venue).gaps} ${t('gapWord')}`"
                      ></span>
                    </span>
                  </button>
                </div>

                <div x-show="isCardOpen(venue)">
                  <!-- Atmospheric Visual Cover Banner (1. Verified Real Photo -> 2. Uploaded Quote Image -> 3. Curated Luxury Cover) -->
                  <div class="relative h-36 w-full overflow-hidden bg-gradient-to-br from-[#F9F3F0] via-[#EFE6E0] to-[#E5D7CC]">
                    <img
                      x-show="!venue.coverError && getVenueCoverUrl(venue)"
                      :src="getVenueCoverUrl(venue)"
                      :alt="displayVenueName(venue)"
                      referrerPolicy="no-referrer"
                      @error="handleCoverImgError(venue)"
                      class="h-full w-full transition-transform duration-300"
                      :class="getActiveCoverKind(venue) === 'quote' ? 'object-contain bg-obsidian' : 'object-cover'"
                    />

                    <!-- Contrast Scrim -->
                    <div
                      x-show="getActiveCoverKind(venue) !== 'quote'"
                      class="pointer-events-none absolute inset-0 bg-gradient-to-t from-obsidian/70 via-obsidian/20 to-transparent"
                    ></div>

                    <!-- Top Left Best Value Badge & Photo Search Status -->
                    <div class="absolute top-3.5 left-3.5 flex flex-wrap items-center gap-2 max-w-[68%]">
                      <span
                        x-show="isBestValue(venue)"
                        class="inline-flex items-center gap-1 rounded-full border border-champagne/60 bg-emeraldSafe-bg/95 px-3 py-1 text-[11px] font-semibold text-emeraldSafe shadow-sm backdrop-blur-md whitespace-nowrap"
                        x-text="t('bestValueBadge')"
                      ></span>
                      <span
                        x-show="!isBestValue(venue) && getDeltaFromLowest(venue) > 0"
                        class="inline-flex items-center rounded-full border border-white/25 bg-obsidian/75 px-3 py-1 text-[11px] font-medium text-pearl tabular-nums backdrop-blur-md whitespace-nowrap"
                        x-text="`+${formatCurrency(getDeltaFromLowest(venue))} ${t('deltaSuffix')}`"
                      ></span>
                      <span
                        x-show="venue.photoStatus === 'searching'"
                        x-cloak
                        class="inline-flex items-center gap-1.5 rounded-full border border-white/30 bg-obsidian/75 px-2.5 py-1 text-[10px] font-medium text-pearl backdrop-blur-md whitespace-nowrap"
                      >
                        <span class="h-1.5 w-1.5 rounded-full bg-champagne animate-pulse"></span>
                        <span x-text="t('photoSearching')"></span>
                      </span>
                    </div>

                    <!-- Top Right Controls: Refresh Photo + Cover Layer Toggle + Remove Card -->
                    <div class="absolute top-3.5 right-3.5 flex items-center gap-1.5">
                      <button
                        type="button"
                        x-show="(venue.name || '').trim().length >= 2"
                        @click="fetchVenuePhoto(venue.id, true)"
                        :disabled="venue.photoStatus === 'searching'"
                        :title="t('photoRefreshTitle')"
                        :aria-label="t('photoRefreshTitle')"
                        class="flex h-7 w-7 items-center justify-center rounded-full border border-white/25 bg-obsidian/65 text-pearl/95 backdrop-blur-md transition-colors hover:border-champagne hover:bg-obsidian disabled:opacity-50"
                      >
                        <i data-lucide="camera" class="h-3.5 w-3.5" :class="venue.photoStatus === 'searching' ? 'animate-pulse text-champagne' : ''"></i>
                      </button>

                      <button
                        type="button"
                        x-show="getAvailableCoverModes(venue).length > 1"
                        @click="cycleCoverMode(venue)"
                        class="rounded-full border border-white/30 bg-obsidian/70 px-2.5 py-1 text-[11px] font-medium text-pearl backdrop-blur-md transition-colors hover:bg-obsidian whitespace-nowrap"
                        x-text="`${t('coverShow')} ${getNextCoverToggleLabel(venue)}`"
                      ></button>

                      <button
                        type="button"
                        x-show="getActiveCoverKind(venue) === 'quote' && (venue.extraPreviews || []).length > 0"
                        @click="cyclePreview(venue)"
                        class="rounded-full border border-white/30 bg-obsidian/70 px-2.5 py-1 text-[11px] font-medium text-pearl backdrop-blur-md transition-colors hover:bg-obsidian"
                        x-text="`${t('nextPreview')} (${(venue.extraPreviews || []).length + 1})`"
                      ></button>

                      <button
                        type="button"
                        x-show="venues.length >= 2"
                        @click="toggleCard(venue)"
                        :title="t('cardCollapse')"
                        :aria-label="t('cardCollapse')"
                        class="flex h-7 w-7 items-center justify-center rounded-full border border-white/25 bg-obsidian/65 text-pearl/90 backdrop-blur-md transition-colors hover:bg-obsidian"
                      >
                        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
                      </button>

                      <button
                        type="button"
                        @click="removeVenue(venue.id)"
                        :title="t('removeVenueLabel')"
                        :aria-label="t('removeVenueLabel')"
                        class="flex h-7 w-7 items-center justify-center rounded-full border border-white/25 bg-obsidian/65 text-pearl/90 backdrop-blur-md transition-colors hover:bg-peony hover:text-white"
                      >
                        <i data-lucide="x" class="h-3.5 w-3.5"></i>
                      </button>
                    </div>

                    <!-- Bottom Overlay Metadata (Region, Type & Verified Source Attribution) -->
                    <div
                      x-show="getActiveCoverKind(venue) !== 'quote'"
                      class="absolute right-3.5 bottom-3 left-3.5 flex flex-wrap items-center justify-between gap-1.5"
                    >
                      <div class="flex flex-wrap items-center gap-1.5">
                        <span
                          class="rounded-full border border-white/25 bg-white/85 px-2.5 py-0.5 text-[11px] font-semibold text-obsidian backdrop-blur-md"
                          x-text="venue.region[lang]"
                        ></span>
                        <span
                          class="rounded-full border border-white/20 bg-obsidian/60 px-2.5 py-0.5 text-[11px] font-medium text-pearl backdrop-blur-md"
                          x-text="venue.venueType[lang]"
                        ></span>
                      </div>

                      <a
                        x-show="getActiveCoverKind(venue) === 'real' && venue.realPhotoSourceLabel"
                        :href="venue.realPhotoSourceUrl || '#'"
                        target="_blank"
                        rel="noopener noreferrer"
                        @click.stop
                        class="inline-flex items-center gap-1 rounded-full border border-champagne/40 bg-obsidian/70 px-2.5 py-0.5 text-[10px] font-medium text-pearl/95 backdrop-blur-md transition-colors hover:border-champagne hover:text-champagne"
                      >
                        <span x-text="`📷 ${venue.realPhotoSourceLabel}`"></span>
                      </a>

                      <span
                        x-show="getActiveCoverKind(venue) === 'mood'"
                        class="inline-flex items-center rounded-full border border-white/25 bg-obsidian/60 px-2.5 py-0.5 text-[10px] font-medium text-pearl/95 backdrop-blur-md"
                        x-text="t('illustrativeBadge')"
                      ></span>
                    </div>
                  </div>

                  <!-- Card Inner Body -->
                  <div class="p-6 sm:p-7">
                    <!-- Title + Edit Action Row -->
                    <div class="flex items-start justify-between gap-3">
                      <div class="min-w-0 flex-1">
                        <!-- Unknown Venue Name Prompt -->
                        <div x-show="venue.nameUnknown && !(venue.name && venue.name.trim())" class="rounded-2xl border border-[#FECDD3] bg-peony-bg/70 p-3">
                          <label class="block">
                            <span class="block text-[11px] font-semibold text-peony" x-text="t('unknownNameBadge')"></span>
                            <input
                              type="text"
                              x-model="venue.name"
                              @change="onVenueNameCommitted(venue)"
                              @keydown.enter.prevent="onVenueNameCommitted(venue)"
                              :placeholder="t('unknownNamePlaceholder')"
                              class="mt-1.5 w-full rounded-xl border border-champagne-line bg-white px-3 py-1.5 font-serif text-lg font-semibold text-obsidian placeholder:font-sans placeholder:text-xs placeholder:font-normal placeholder:text-stone/70 focus:border-champagne focus:outline-none"
                            />
                          </label>
                        </div>

                        <!-- Venue Title -->
                        <h3
                          x-show="!venue.nameUnknown || (venue.name && venue.name.trim())"
                          @click="venue.editing = true"
                          :title="t('editBtn')"
                          class="cursor-pointer font-serif text-2xl font-semibold tracking-tight text-obsidian hover:text-stone transition-colors sm:text-[1.85rem] leading-tight"
                          x-text="displayVenueName(venue)"
                        ></h3>

                        <p class="mt-1 text-xs text-stone break-words" x-text="venue.sourceLabel[lang]"></p>
                      </div>

                      <button
                        type="button"
                        @click="if (venue.editing) onVenueNameCommitted(venue); venue.editing = !venue.editing"
                        class="rounded-full border border-champagne-line bg-blush/80 px-3.5 py-1.5 text-xs font-medium text-obsidian transition-colors hover:border-champagne hover:bg-white whitespace-nowrap shrink-0"
                        x-text="venue.editing ? t('doneEditingBtn') : t('editBtn')"
                      ></button>
                    </div>

                    <!-- Merge into another card -->
                    <div x-show="venues.length >= 2" class="mt-3 flex items-center justify-end">
                      <select
                        aria-label="Merge venue"
                        @change="if ($event.target.value) { mergeVenueInto(venue.id, $event.target.value); $event.target.value = ''; }"
                        class="rounded-full border border-champagne-line bg-pearl px-3 py-1 text-[11px] font-medium text-stone transition-colors hover:border-champagne hover:text-obsidian focus:border-champagne focus:outline-none"
                      >
                        <option value="" x-text="t('mergeSelectPlaceholder')"></option>
                        <template x-for="other in venues.filter(o => o.id !== venue.id)" :key="'m-' + other.id">
                          <option :value="other.id" x-text="`↳ ${displayVenueName(other)}`"></option>
                        </template>
                      </select>
                    </div>

                    <!-- Full Inline Edit Panel -->
                    <div x-show="venue.editing" x-cloak class="mt-3.5 grid grid-cols-1 gap-3 rounded-2xl border border-champagne-line bg-blush/60 p-4 text-xs sm:grid-cols-2">
                      <label class="block">
                        <span class="block text-[11px] font-medium text-stone" x-text="t('nameEditLabel')"></span>
                        <input
                          type="text"
                          x-model="venue.name"
                          @input="if(venue.name.trim()) venue.nameUnknown = false"
                          @change="onVenueNameCommitted(venue)"
                          @keydown.enter.prevent="onVenueNameCommitted(venue)"
                          :placeholder="t('unknownNamePlaceholder')"
                          class="mt-1 w-full rounded-xl border border-champagne-line bg-white px-3 py-1.5 text-sm font-medium text-obsidian focus:border-champagne focus:outline-none"
                        />
                      </label>
                      <label class="block">
                        <span class="block text-[11px] font-medium text-stone" x-text="t('regionEditLabel')"></span>
                        <input
                          type="text"
                          x-model="venue.region[lang]"
                          @change="if ((venue.name || '').trim().length >= 2) fetchVenuePhoto(venue.id, false)"
                          class="mt-1 w-full rounded-xl border border-champagne-line bg-white px-3 py-1.5 text-sm font-medium text-obsidian focus:border-champagne focus:outline-none"
                        />
                      </label>
                      <label class="block">
                        <span class="block text-[11px] font-medium text-stone" x-text="t('baseFeeEditLabel')"></span>
                        <input
                          type="number"
                          min="0"
                          step="100"
                          x-model.number="venue.baseFeeEur"
                          class="mt-1 w-full rounded-xl border border-champagne-line bg-white px-3 py-1.5 text-sm font-semibold text-obsidian tabular-nums focus:border-champagne focus:outline-none"
                        />
                      </label>
                      <label class="block">
                        <span class="block text-[11px] font-medium text-stone" x-text="t('fbEditLabel')"></span>
                        <input
                          type="number"
                          min="0"
                          step="5"
                          x-model.number="venue.fbPerPersonEur"
                          class="mt-1 w-full rounded-xl border border-champagne-line bg-white px-3 py-1.5 text-sm font-semibold text-obsidian tabular-nums focus:border-champagne focus:outline-none"
                        />
                      </label>
                      <label class="block">
                        <span class="block text-[11px] font-medium text-stone" x-text="t('minSpendEditLabel')"></span>
                        <input
                          type="number"
                          min="0"
                          step="100"
                          x-model.number="venue.minimumSpendEur"
                          class="mt-1 w-full rounded-xl border border-champagne-line bg-white px-3 py-1.5 text-sm font-semibold text-obsidian tabular-nums focus:border-champagne focus:outline-none"
                        />
                      </label>
                      <label class="block">
                        <span class="block text-[11px] font-medium text-stone" x-text="t('validEditLabel')"></span>
                        <input
                          type="date"
                          x-model="venue.validUntil"
                          class="mt-1 w-full rounded-xl border border-champagne-line bg-white px-3 py-1.5 text-sm font-semibold text-obsidian focus:border-champagne focus:outline-none"
                        />
                      </label>
                      <template x-for="row in [...topNotes, ...bottomNotes]" :key="row.key">
                        <label class="block sm:col-span-2">
                          <span class="block text-[11px] font-medium text-stone" x-text="t(row.edit)"></span>
                          <input
                            type="text"
                            maxlength="160"
                            x-model="venue[row.key][lang]"
                            class="mt-1 w-full rounded-xl border border-champagne-line bg-white px-3 py-1.5 text-sm text-obsidian focus:border-champagne focus:outline-none"
                          />
                        </label>
                      </template>
                    </div>

                    <!-- Merge conflicts: two documents disagree -->
                    <div x-show="(venue.mergeConflicts || []).length > 0" class="mt-4 space-y-2 rounded-xl border border-amber-300 bg-amber-50 p-3">
                      <p class="text-xs font-semibold text-amber-900" x-text="'⚠ ' + t('conflictTitle')"></p>
                      <template x-for="c in venue.mergeConflicts || []" :key="c.key">
                        <div class="rounded-lg bg-white/85 p-2 text-xs">
                          <div class="font-semibold text-obsidian" x-text="t(conflictLabelKey(c.key))"></div>
                          <div class="mt-1.5 flex flex-wrap gap-1.5">
                            <button type="button" @click="resolveMergeConflict(venue.id, c.key, 'current')" class="rounded-full border border-champagne-line bg-pearl px-3 py-1 text-[11px] font-medium text-obsidian hover:border-champagne">
                              <span class="text-stone" x-text="t('conflictKeep')"></span> <strong x-text="conflictValue(c, 'current')"></strong>
                            </button>
                            <button type="button" @click="resolveMergeConflict(venue.id, c.key, 'incoming')" class="rounded-full border border-champagne-line bg-pearl px-3 py-1 text-[11px] font-medium text-obsidian hover:border-champagne">
                              <span class="text-stone" x-text="t('conflictUse')"></span> <strong x-text="conflictValue(c, 'incoming')"></strong>
                            </button>
                          </div>
                        </div>
                      </template>
                    </div>

                    <!-- Base Metrics Breakdown -->
                    <dl class="mt-5 divide-y divide-champagne-soft border-y border-champagne-soft text-sm">
                      <div class="flex items-center justify-between py-3">
                        <dt class="text-stone" x-text="t('baseFeeLabel')"></dt>
                        <dd class="font-semibold text-obsidian tabular-nums">
                          <span x-show="!completeness(venue).rentMissing" x-text="formatCurrency(venue.baseFeeEur)"></span>
                          <span x-show="completeness(venue).rentMissing" class="font-normal text-stone/50" :title="t('termsNotStated')">—</span>
                        </dd>
                      </div>

                      <div class="flex items-center justify-between py-3">
                        <dt class="text-stone">
                          <span x-text="t('fbPerPersonLabel')"></span>
                          <span class="text-xs text-stone/80 tabular-nums" x-text="`(${formatCurrency(venue.fbPerPersonEur)} × ${guestCount})`"></span>
                        </dt>
                        <dd class="font-semibold text-obsidian tabular-nums">
                          <span x-show="!completeness(venue).foodMissing" x-text="formatCurrency(calculateBreakdown(venue).fbSubtotalEur)"></span>
                          <span x-show="completeness(venue).foodMissing" class="font-normal text-stone/50" :title="t('termsNotStated')">—</span>
                        </dd>
                      </div>

                      <div class="flex items-center justify-between py-3">
                        <dt class="text-stone" x-text="t('selectedExtrasLabel')"></dt>
                        <dd
                          class="font-semibold tabular-nums"
                          :class="calculateBreakdown(venue).hiddenExtrasTotalEur > 0 ? 'text-peony' : 'text-emeraldSafe'"
                          x-text="calculateBreakdown(venue).hiddenExtrasTotalEur > 0 ? `+${formatCurrency(calculateBreakdown(venue).hiddenExtrasTotalEur)}` : formatCurrency(0)"
                        ></dd>
                      </div>
                    </dl>

                    <!-- Live Visual Budget Distribution Bar -->
                    <div class="mt-4">
                      <div class="flex items-center justify-between text-[11px] text-stone">
                        <span class="font-medium" x-text="t('budgetMixLabel')"></span>
                        <div class="flex items-center gap-2.5 tabular-nums">
                          <span class="inline-flex items-center gap-1">
                            <span class="h-2 w-2 rounded-full bg-obsidian"></span>
                            <span x-text="`${t('legendRent')} %${getBudgetDistribution(venue).baseShare || 0}`"></span>
                          </span>
                          <span class="inline-flex items-center gap-1">
                            <span class="h-2 w-2 rounded-full bg-champagne"></span>
                            <span x-text="`${t('legendFb')} %${getBudgetDistribution(venue).fbShare || 0}`"></span>
                          </span>
                          <span class="inline-flex items-center gap-1">
                            <span class="h-2 w-2 rounded-full bg-peony"></span>
                            <span x-text="`${t('legendExtras')} %${getBudgetDistribution(venue).extrasShare || 0}`"></span>
                          </span>
                        </div>
                      </div>
                      <div class="mt-2 flex h-2 w-full overflow-hidden rounded-full bg-[#F4ECE4]">
                        <div
                          class="h-full bg-obsidian transition-all duration-300"
                          :style="`width: ${getBudgetDistribution(venue).basePct}%`"
                        ></div>
                        <div
                          class="h-full bg-champagne transition-all duration-300"
                          :style="`width: ${getBudgetDistribution(venue).fbPct}%`"
                        ></div>
                        <div
                          class="h-full bg-peony transition-all duration-300"
                          :style="`width: ${getBudgetDistribution(venue).extrasPct}%`"
                        ></div>
                      </div>
                    </div>

                    <!-- Highlighted Silk-Champagne Turnkey Total Spotlight -->
                    <div
                      class="mt-4 rounded-2xl border p-5 bg-gradient-to-br from-[#FAF6F2] to-[#F4ECE4]"
                      :class="isBestValue(venue) ? 'border-emeraldSafe/40' : 'border-champagne-line'"
                    >
                      <div class="flex items-center justify-between gap-3">
                        <span class="text-xs font-semibold tracking-wider uppercase text-stone" x-text="t('turnkeyTitle')"></span>
                        <span
                          x-show="isBestValue(venue)"
                          class="inline-flex items-center gap-1 text-xs font-semibold text-emeraldSafe whitespace-nowrap"
                          x-text="t('bestValueBadge')"
                        ></span>
                      </div>

                      <div class="mt-2 flex items-baseline justify-between gap-4">
                        <span class="flex items-baseline gap-2">
                          <span x-show="isEstimate(venue)" class="text-xs font-medium text-stone" x-text="t('fromPrefix')"></span>
                          <span
                            class="font-serif text-[2.25rem] leading-none font-semibold tracking-tight text-obsidian tabular-nums sm:text-[2.5rem]"
                            x-text="formatCurrency(calculateBreakdown(venue).turnkeyTotalEur)"
                          ></span>
                        </span>
                        <span class="text-xs text-stone tabular-nums whitespace-nowrap">
                          <span x-text="t('perGuestNet')"></span>
                          <strong class="font-semibold text-obsidian" x-text="formatCurrency(calculateBreakdown(venue).effectivePerGuestEur)"></strong>
                        </span>
                      </div>
                    </div>

                    <!-- Missing-information warnings: the total only counts what the quote states -->
                    <div
                      x-show="completeness(venue).rentMissing || completeness(venue).foodMissing || completeness(venue).needsPriceCount > 0 || statedCheck(venue).kind === 'mismatch'"
                      class="mt-3 space-y-1 rounded-xl bg-amber-50 px-3 py-2.5 text-xs leading-relaxed text-amber-800"
                    >
                      <p x-show="completeness(venue).rentMissing" x-text="'⚠ ' + t('warnRentMissing')"></p>
                      <p x-show="completeness(venue).foodMissing" x-text="'⚠ ' + t('warnFoodMissing')"></p>
                      <p x-show="completeness(venue).needsPriceCount > 0" x-text="'⚠ ' + completeness(venue).needsPriceCount + ' ' + t('warnNeedsPriceTail')"></p>
                      <p x-show="statedCheck(venue).kind === 'mismatch'" x-text="'⚠ ' + t('warnTotalMismatch') + ' (' + formatCurrency(statedCheck(venue).computedEur) + ' / ' + formatCurrency(statedCheck(venue).statedEur) + ')'"></p>
                    </div>

                    <!-- Quote Terms: minimum spend, deposit, cancellation, validity -->
                    <div class="mt-6">
                      <button type="button" @click="toggleSection(venue, 'terms')" :aria-expanded="sectionOpen(venue, 'terms')" class="flex w-full items-center justify-between gap-2 text-left">
                        <h4 class="text-xs font-semibold tracking-wider uppercase text-obsidian" x-text="t('termsTitle')"></h4>
                        <span class="text-xs text-stone transition-transform duration-150" :class="sectionOpen(venue, 'terms') ? '' : '-rotate-90'">▾</span>
                      </button>
                      <dl x-show="sectionOpen(venue, 'terms') && summaryRows(venue).length > 0" class="mt-3 divide-y divide-champagne-soft rounded-2xl border border-champagne-soft text-sm">
                        <template x-for="row in topNotes" :key="row.key">
                          <div x-show="venue[row.key][lang]" class="flex flex-col gap-1 px-4 py-2.5 sm:flex-row sm:items-start sm:justify-between sm:gap-4">
                            <dt class="text-stone" x-text="t(row.label)"></dt>
                            <dd class="sm:text-right text-obsidian" x-text="venue[row.key][lang]"></dd>
                          </div>
                        </template>
                        <div x-show="venue.statedTotalEur > 0" class="flex flex-col gap-1 px-4 py-2.5 sm:flex-row sm:items-start sm:justify-between sm:gap-4">
                          <dt class="text-stone" x-text="t('termsStatedTotal')"></dt>
                          <dd class="sm:text-right tabular-nums font-semibold text-obsidian" x-text="formatCurrency(venue.statedTotalEur)"></dd>
                        </div>
                        <div x-show="venue.minimumSpendEur > 0" class="flex flex-col gap-1 px-4 py-2.5 sm:flex-row sm:items-start sm:justify-between sm:gap-4">
                          <dt class="text-stone" x-text="t('termsMinSpend')"></dt>
                          <dd class="sm:text-right tabular-nums font-semibold text-obsidian" x-text="formatCurrency(venue.minimumSpendEur)"></dd>

                                            <p x-show="sectionOpen(venue, 'terms') && summaryGaps(venue).asks.length > 0" class="mt-2 text-[11px] leading-relaxed text-stone/80" x-text="t('termsMissingPrefix') + ': ' + summaryGaps(venue).asks.join(', ')"></p>

                    <!-- Aligned Fixed-Order Cost Categories across Venue Cards -->

                      <button type="button" @click="toggleSection(venue, 'extras')" :aria-expanded="sectionOpen(venue, 'extras')" class="flex w-full items-start justify-between gap-3 text-left">
